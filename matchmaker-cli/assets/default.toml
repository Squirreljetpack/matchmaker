[[preview.layout]]
command = '''
mm -q --image {1} && exit 0
if command -v fs >/dev/null 2>&1; then
    fs :tool pg -- {1}
elif [ -d {1} ]; then
    if command -v eza >/dev/null 2>&1; then
        eza --color=always -T -L 2 -- {1}
    else
        find {1} -maxdepth 2 | sed 's|[^/]*/|  |g'
    fi
else
    if command -v bat >/dev/null 2>&1; then
        bat --binary no-printing --color=always --style=-numbers -- {1}
    else
        cat -- {1}
    fi
fi
'''

side = "right"
percentage = 40
min = 30
max = 120

[[preview.layout]]
side = "top"
percentage = 55
min = 5
max = 50

[[preview.layout]]
side = "right"
percentage = 75
min = 5
max = 240

[columns]
names = ["file"]

[start.command]
command = '''
    if command -v fd >/dev/null 2>&1; then
        fd --strip-cwd-prefix --print0
    else
        find . -print0
    fi
    '''
separator = "\\0"

[exit]
abort_empty = true
