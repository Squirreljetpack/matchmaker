# Pi extensions manager
#
# Maintains a mirrored list at ~/.pi/agent/mm_extensions (one JSON extension
# definition per line; lines prefixed with `# ` are disabled) and syncs the
# enabled set into pi's settings.json `packages` array:
#
#   enter         toggle the selected extensions (all must share the same state)
#   tab           multi-select (see global config)
#   alt-enter     write the enabled set to the global settings (~/.pi/agent/settings.json)
#   ctrl-enter    write the enabled set to the project settings (.pi/settings.json)
#   alt-r         reconcile: sync mm_extensions with what is actually defined in
#                 the global or project settings (creates the file if missing)
#
# Point MM_EXTENSIONS_FILE elsewhere to use a different mm_extensions file.
#
# All commands in this preset are Python (`shell = ['python', '-c']`); the
# standalone helpers live in pi_extensions_{reconcile,set,preview}.py next to
# this file. Injected placeholder values ({1}, {+1}, ...) sit inside raw
# python strings (r"""...""") so backslashes in values stay literal.
#
# Binds that just call a helper use the `@` syntax: `@pi_extensions_set.py
# global` resolves the script next to `MM_OVERRIDE` and runs it via `shell[0]`
# (python) with the remaining words as arguments.

[start]
shell = ['python', '-c']
command = '''
import json, os, subprocess, sys

mmx = os.environ.get("MM_EXTENSIONS_FILE") or os.path.expanduser("~/.pi/agent/mm_extensions")
base = os.path.dirname(os.environ["MM_OVERRIDE"])

if not os.path.isfile(mmx) or os.path.getsize(mmx) == 0:
    # seed the list from the global/project settings
    subprocess.run([sys.executable, os.path.join(base, "pi_extensions_reconcile.py")], stdout=sys.stderr)

if not os.path.isfile(mmx):
    sys.stderr.write("error: mm_extensions not found: " + mmx + "\n")
    sys.exit(1)

with open(mmx, encoding="utf-8") as f:
    for line in f.read().splitlines():
        if line.startswith("# "):
            state = "✗"
            stripped = line[2:]
        elif line.startswith("#"):
            state = "✗"
            stripped = line[1:]
        else:
            state = "✓"
            stripped = line

        # keep only real definitions: skip blank and whitespace-only lines
        if not stripped.strip():
            continue

        # each definition is a JSON value; its `source` is the display name
        try:
            value = json.loads(stripped.rstrip(","))
        except json.JSONDecodeError:
            sys.stderr.write("warning: skipping unparseable line: " + stripped + "\n")
            continue
        name = value.get("source") if isinstance(value, dict) else value
        if name is None:
            continue
        print(name + "\t" + state)
'''

[columns]
max = 2
names = [
    { name = "ext", options = "Optional | OrUseDefault" },
    { name = "on", options = "Optional | OrUseDefault" },
]
default = "ext"
split = "\t"

[header]
content = ["extension", "on"]

# [footer]
# content = "enter: toggle | tab: multi-select | alt-enter: set global | ctrl-enter: set local | alt-r: reconcile"

[query]
prompt = "extensions> "

[matcher]
sort.threshold = 40

# --- Preview ---
[preview]
show = true

[previewer]
shell = ['python', '-c']

[[preview.layout]]
command = '''
import os, shlex, subprocess, sys
args = shlex.split(r"""{1}""")
if args:
    subprocess.run([sys.executable, os.path.join(os.path.dirname(os.environ["MM_OVERRIDE"]), "pi_extensions_preview.py"), args[0]])
'''

[[preview.layout]]
command = '''
import subprocess
subprocess.run(
    ["bat", "--wrap=never", "--color=always", "-pp", "-l", "md"],
    input="""Usage:

This preset reads `~/.pi/agent/mm_extensions` (`MM_EXTENSIONS_FILE`) for your desired extension setup.
The rows shown may not reflect your current pi settings! Trigger `@reconcile` (ctrl-r) to update the file to reflect your current extension settings for this project.
Trigger `@accept` to toggle extensions.
`@set global` or `@set local` to apply the shown configuration local/global pi settings.
""",
    text=True,
)
'''

[[preview.layout]]
command = '''
import os, shlex, subprocess, sys
args = shlex.split(r"""{1}""")
if args:
    base = os.path.dirname(os.environ["MM_OVERRIDE"])
    r = subprocess.run(
        [sys.executable, os.path.join(base, "pi_extensions_preview.py"), "--dir", args[0]],
        capture_output=True, text=True,
    )
    if r.returncode == 0:
        d = r.stdout.strip()
        for readme in ("README.md", "readme.md"):
            p = os.path.join(d, readme)
            if os.path.isfile(p):
                subprocess.run(["bat", "--wrap=never", "--color=always", "-pp", "-l", "md", "--", p])
                break
'''

# --- Binds ---
[binds]
"ctrl-g" = "@set global"
"ctrl-enter" = "@set local"
"ctrl-e" = "@set local"
"@reload" = ["@reconcile", "Reload"]
# "@start" = ["@reconcile", "Reload"]
"@accept" = ["@toggle extension", "Reload"]

"@set global" = 'ExecuteOrConfirm(@pi_extensions_set.py global)'
"@set local" = 'ExecuteOrConfirm(@pi_extensions_set.py local)'
"@reconcile" = 'ExecuteOrConfirm(@pi_extensions_reconcile.py)'
"@toggle extension" = '''ExecuteOrConfirm(
import json, os, shlex, subprocess, sys, tempfile

mmx = os.environ.get("MM_EXTENSIONS_FILE") or os.path.expanduser("~/.pi/agent/mm_extensions")

if not os.path.isfile(mmx):
    sys.stderr.write("error: mm_extensions not found: " + mmx + "\n")
    sys.exit(1)

# every selected extension must share the same state (cursor row when nothing is selected)
names = shlex.split(r"""{+1}""")
states = shlex.split(r"""{+2}""")
if not names:
    sys.stderr.write("error: no extension selected\n")
    sys.exit(1)
if len(set(states)) > 1:
    sys.stderr.write("error: selection mixes enabled and disabled extensions\n")
    sys.exit(1)
mode = "off" if states[0] == "✓" else "on"

with open(mmx, encoding="utf-8") as f:
    lines = f.read().splitlines()

out = []
for line in lines:
    if line.startswith("# "):
        stripped = line[2:]
    elif line.startswith("#"):
        stripped = line[1:]
    else:
        stripped = line

    if not stripped.strip():
        out.append(line)
        continue

    try:
        value = json.loads(stripped.rstrip(","))
    except json.JSONDecodeError:
        out.append(line)
        continue
    name = value.get("source") if isinstance(value, dict) else value

    if name in names:
        if mode == "off":
            out.append(line if line.startswith("#") else "# " + line)
        else:
            out.append(stripped if line.startswith("#") else line)
    else:
        out.append(line)

fd, tmp = tempfile.mkstemp(prefix="mm_toggle.", suffix=".tmp", dir=os.path.dirname(os.path.abspath(mmx)))
with os.fdopen(fd, "w", encoding="utf-8") as f:
    f.write("\n".join(out) + ("\n" if out else ""))
os.replace(tmp, mmx)
print("toggled " + str(len(names)) + " extension(s) " + mode + " (apply with alt-enter / ctrl-enter)")
)'''
