"@toggle_up" = '''Execute(#!lua
local c = state.current
if not c then return end
local action = "down"
if c.status:find("down", 1, true) or c.status:find("exited", 1, true) then action = "up" end
if c.source == "pod" then
    local pod_cmd = action == "up" and "start" or "rm"
    local r = proc.run("podman", { "pod", pod_cmd, c.id })
    if not r.ok then error(r.stderr) end
else
    local tool
    if c.id:find("docker", 1, true) then
        tool = "docker"
    elseif c.id:find("podman", 1, true) then
        tool = "podman"
    else
        tool = proc.has("docker") and "docker" or "podman"
    end
    local argv = { "compose" }
    for f in (c.id .. ","):gmatch("([^,]*),") do
        if f ~= "" then argv[#argv + 1] = "-f"; argv[#argv + 1] = f end
    end
    argv[#argv + 1] = action
    if action == "up" then argv[#argv + 1] = "-d" end
    local r = proc.run(tool, argv)
    if not r.ok then error(r.stderr) end
end
)'''

"@toggle_up_full" = '''Execute(#!lua
local c = state.current
if not c then return end
local action = "down"
if c.status:find("down", 1, true) or c.status:find("exited", 1, true) then action = "up" end
if c.source == "pod" then
    local pod_cmd = action == "up" and "start" or "rm"
    local extra = action == "down" and { "-v", "--remove-orphans" } or { "-w" }
    local argv = { "pod", pod_cmd, c.id }
    for _, e in ipairs(extra) do argv[#argv + 1] = e end
    local r = proc.run("podman", argv)
    if not r.ok then error(r.stderr) end
else
    local tool
    if c.id:find("docker", 1, true) then
        tool = "docker"
    elseif c.id:find("podman", 1, true) then
        tool = "podman"
    else
        tool = proc.has("docker") and "docker" or "podman"
    end
    local argv = { "compose" }
    for f in (c.id .. ","):gmatch("([^,]*),") do
        if f ~= "" then argv[#argv + 1] = "-f"; argv[#argv + 1] = f end
    end
    argv[#argv + 1] = action
    if action == "up" then
        argv[#argv + 1] = "-w"
    else
        argv[#argv + 1] = "-v"
        argv[#argv + 1] = "--remove-orphans"
    end
    local r = proc.run(tool, argv)
    if not r.ok then error(r.stderr) end
end
)'''

"@ls" = '''RunPreview(
if ({source} -eq 'pod') {
    Write-Output 'No directory for pod source'
} else {
    $id = {id}
    $dir = if ($id -match '[/\\]') { Split-Path -Parent $id } else { Join-Path $env:DOCKERdir {name} }
    Get-ChildItem -LiteralPath $dir -Force
}
)'''
"@edit_env" = '''Execute(
if ({source} -eq 'pod') {
    Write-Output 'No .env for pod source. Press Enter to continue.'
    Read-Host | Out-Null
} else {
    $id = {id}
    $dir = if ($id -match '[/\\]') { Split-Path -Parent $id } else { Join-Path $env:DOCKERdir {name} }
    $editor = $(if ($env:EDITOR) { $env:EDITOR } else { 'notepad' }) -split '\s+'
    & $editor[0] @($editor | Select-Object -Skip 1) (Join-Path $dir '.env')
}
)'''

[query]
prompt = "compose> "

[tui]
percentage = 100
