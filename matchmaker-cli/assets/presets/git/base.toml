# Common binds and actions for Git presets

[start]
directory = { value = "git rev-parse --show-toplevel", exec = true, force = true }

[binds]
"ctrl-s" = "@show"
"alt-d" = "@diff"
"alt-l" = "@log"

"@reload" = ["#next tab", "ReloadNext"]
"@reload_2" = ["#prev tab", "ReloadPrev"]

"@diff" = '''Execute(
set -- {+1}
if [ "$#" -eq 1 ] && [ {1} != "$1" ]; then
  set -- "$1" {1}
fi
if [ "$#" -eq 2 ]; then
  git --paginate diff --color=always --exit-code "$1" "$2" && echo no change
else
  git --paginate diff --color=always --exit-code {1} && echo no change
fi
)'''
"@show" = "Execute(git --paginate show --color=always {1} -- {$0})"
"@log" = '''Execute(
git --paginate log --graph --decorate=short --date=short \
"--pretty=format:%C(yellow)%h%C(reset) %C(blue)%ad%C(reset) %C(green)%an%C(reset) %s %C(red)%d%C(reset)"
)'''

[results]
inactive.fg = "DarkGray"
inactive_current.fg = "DarkGray"
style.fg = "Reset"

[envs]
DFT_COLOR = "always"

[exit]
abort_empty = false

[preview]
show = true
