# restore a file or revision

source = 'base.toml'

[start]
command = '[ $# -eq 0 ] && set -- .; git log --pretty=format:"%h%x00%ad%x00%s" --date=format:"$DATE_FORMAT" -- "$@"'
additional_commands = [
    "",
    '''
  if $HAS_AWK; then
      git stash list --format="%gd%x00%at%x00%gs" |
      awk -F'\x00' -v OFS='\x00' -v fmt="$DATE_FORMAT" \
          '{$2 = strftime(fmt, $2); print}'
  else
      git stash list --format="%gd%x00%cr%x00%gs"
  fi
  ''',
    '''
  [ $# -eq 0 ] && set -- .
  if $HAS_AWK; then
    git reflog --all --format="%h%x00%at%x00%gD: %gs" -- "$@" |
    awk -F'\x00' -v OFS='\x00' -v fmt="$DATE_FORMAT" \
      '{$2 = strftime(fmt, $2); print}'
  else
      git reflog --date=human --format="%h%x00%ad%x00%s" -- "$@"
  fi
  ''',
    '[ $# -eq 0 ] && set -- .; git log --all --pretty=format:"%h%x00%ad%x00%s" --date=format:"$DATE_FORMAT" -- "$@"',
]
output_template = '{=ref}'

[columns]
split = "\\x00"
names = ["ref", "time", "message"]
default = 1

[matcher]
sort.threshold = 40

[envs]
# --date=human looks better but is less searchable
DATE_FORMAT = "%Y-%m-%d %H:%M"
HAS_AWK = { value = "awk 'BEGIN { strftime(); exit }' >/dev/null 2>&1 && echo true || echo false", exec = true }

# --- Preview ---
[previewer]
always_trigger = false

[[preview.layout]]
command = '''
git -c color.ui=always show --stat --summary --decorate {1}
'''
frame = { title = "Commit Summary" }
side = "right"
percentage = 40
min = 30
max = 120

[[preview.layout]]
side = "top"
percentage = 50
min = 5
max = 50
command = '''
if [ -n "{$0}" ]; then
  if git diff --quiet {1} -- {$0}; then
    echo "no change"
  else
    git diff --color=always {1} -- {$0}
  fi
elif [ "$MM_INDEX" = 1 ]; then
  IFS="
"
  set -f
  set -- $(git stash show -u --name-only {1} 2>/dev/null)
  set +f
  unset IFS
  if [ "$#" -gt 0 ]; then
    out=$(git diff --color=always {1} -- "$@")
    if [ -z "$out" ]; then
      echo "no change"
    else
      echo "$out"
    fi
  else
    echo "no change"
  fi
elif git diff --quiet {1} -- .; then
  echo "no change"
else
  git diff --color=always {1} -- .
fi
'''
frame = { title = "Working Tree Diff" }

[[preview.layout]]
command = '''
if [ -n "{$0}" ]; then
  set -- {$0}
  first=1
  ROOT=$(pwd -P 2>/dev/null || pwd)
  for p; do
    rel="$p"
    case "$rel" in
      "$PWD/"*) rel="${rel#"$PWD/"}" ;;
      "$ROOT/"*) rel="${rel#"$ROOT/"}" ;;
    esac
    rel="${rel#./}"
    if [ "$rel" = "." ]; then
      if [ "$MM_INDEX" = 1 ]; then
        git -c color.ui=always stash show -u -p {1}
      else
        git show --color=always {1}
      fi
      exit 0
    fi
    if [ "$#" -gt 1 ]; then
      [ "$first" = 0 ] && echo ""
      echo "=== $rel ==="
    fi
    if git cat-file -e {1}:"$rel" 2>/dev/null; then
      if command -v bat >/dev/null 2>&1; then
        git show {1}:"$rel" | bat --wrap=never --color=always -pp --file-name "$rel"
      else
        git show --color=always {1}:"$rel"
      fi
    else
      echo "fatal: path '$rel' does not exist in {1}"
    fi
    first=0
  done
else
  if [ "$MM_INDEX" = 1 ]; then
    git -c color.ui=always stash show -u -p {1}
  else
    git show --color=always {1}
  fi
fi
'''
frame = { title = "Show Ref" }

# --- UI ---
[tui]
percentage = 100

[header]
content = "[history]"
style.modifier = ""

[query]
prompt = "restore> "

[binds]
"@accept" = ["@checkout", "Reload"]
"@return" = "Accept"
"alt-r" = ["#reset/apply stash", "@reset"]
"ctrl-t" = ["@tag", "Reload"]
"@rm" = ["#stash,+squash history/drop stash/clean refs", "@clean", "Reload"]
"ctrl-c" = "@compare"
"alt-c" = "@diffstat"
"alt-m" = ["@edit_msg", "Reload"]
"ctrl-e" = ["@rebase", "Reload"]
"@rename" = ["#rename (+fixup/reorder history)", "@fixup", "Reload"]
"ctrl-x" = "@rename"
"@next" = "BecomeSilent(mm -o git/switch)"
"@prev" = "BecomeSilent(mm -o git/status -F)"
"@help" = '''RunPreview(
  echo 'Restoring:';
  for f in {$0}; do echo "$f"; done
  printf "%${COLUMNS}s\n" | tr ' ' '-'
)
'''

# --- Scripts ---
"Reloaded" = '''Transform(
    HEADERS=(
      '[history]'
      '[stash]'
      '[all_refs]'
      '[reachable]'
    )
    setopt KSH_ARRAYS 2>/dev/null
    echo "SetHeader(${HEADERS[$MM_INDEX]})"
)
'''

"@open" = "ExecuteOrConfirm($EDITOR {$1})"
"@open_2" = []

"@compare" = '''RunPreview(
set -- {+1}
if [ "$#" -eq 1 ] && [ {1} != "$1" ]; then
  set -- "$1" {1}
fi
if [ "$#" -eq 2 ]; then
  a="$1"
  b="$2"
  set -- $(git rev-list --left-right --count "$1"..."$2")
else
  a=HEAD
  b={1}
  set -- $(git rev-list --left-right --count HEAD..{1})
fi
behind=$1
ahead=$2
commits=$(git rev-list --count "$b")
echo "behind: $behind ahead: $ahead commits: $commits"
printf "%${COLUMNS}s\n" | tr ' ' '-'
git log --color=always --left-right --oneline "$a"..."$b"
)'''

"@diffstat" = '''RunPreview(
if [ "$MM_INDEX" = 1 ]; then
  git stash show -u {1}
else
  set -- {+1}
  if [ "$#" -eq 1 ] && [ {1} != "$1" ]; then
    set -- "$1" {1}
  fi
  if [ "$#" -eq 2 ]; then
    git --no-pager diff --color=always --stat --summary "$1" "$2"
  else
    git --no-pager diff --color=always --stat --summary {1}
  fi
fi
exit 1
)'''

"@rebase" = "Execute(git rebase -i {1}'^')"

"@checkout" = '''
BecomeOrConfirm(
set -e

case $MM_INDEX in
  1)
    echo "### Pop Stash ###\n"

    echo "Working directory:"
    printf "%${COLUMNS}s\n" | tr ' ' '-'
    git --no-pager diff --stat

    echo "Stash changes:"
    printf "%${COLUMNS}s\n" | tr ' ' '-'
    git --no-pager stash show {1}
    echo
  ;;
  *)
  echo "### Checkout ###\n"

  if [ -n "{$0}" ]; then
    git --no-pager diff --stat {1} -- {$0}
  else
    git --no-pager diff --stat {1}
  fi
  ;;
esac

if [ -n "{$0}" ]; then
  [ -n "$(git status --porcelain -- {$0})" ] &&
  printf 'Proceed (or stash (all) changes)? [y/N/s/a] ' ||
  printf 'Proceed? [y/N] '
else
  [ -n "$(git status --porcelain)" ] &&
  printf 'Proceed (or stash (all) changes)? [y/N/s/a] ' ||
  printf 'Proceed? [y/N] '
fi

read -r c
case $c in
  [s])
  if [ -n "{$0}" ]; then
    git stash push -- {$0}
  else
    git stash push
  fi
  ;;
  [a])
  if [ -n "{$0}" ]; then
    git stash push -u -- {$0}
  else
    git stash push -u
  fi
  ;;
  [y]) ;;
  *) exit 100 ;;
esac

case $MM_INDEX in
  # return on success
  1) git stash pop {1} && exit 100 ;;
  # leave on success
  *)
  if [ -n "{$0}" ]; then
    git checkout {1} -- {$0}
  else
    git checkout {1}
  fi
  ;;
esac
)
'''

"@reset" = '''BecomeOrConfirm(
set -e
case $MM_INDEX in
1)
  TARGET={1}
  FILES="$(git stash show --name-only "$TARGET" 2>/dev/null || true)"
  STASHED="$(git rev-parse refs/stash 2>/dev/null || true)"

  is_dirty=false
  if [ -n "$FILES" ]; then
    OLD_IFS="$IFS"
    IFS="
"
    set -f
    set -- $FILES
    set +f
    IFS="$OLD_IFS"
    if [ "$#" -gt 0 ] && git status --porcelain -- "$@" 2>/dev/null | grep -q .; then
      is_dirty=true
    fi
  fi

  if $is_dirty; then
    printf 'Affected files are dirty. Proceed? [y/N/s(tash)] '
  else
    printf 'Apply stash %s? [Y/n] ' "$TARGET"
  fi

  read -r c
  case "${c%% *}" in
    [sS]*)
      if [ -n "$FILES" ]; then
        printf '%s\n' "$FILES" |
        git stash push -m "temp backup before stash apply" --pathspec-from-file=-
      else
        git stash push -m "temp backup stash apply"
      fi
      ;;
    [yY]*|"")
      ;;
    *)
      exit 100
      ;;
  esac

  # Shift target index if stash was created.
  NEW_STASH="$(git rev-parse refs/stash 2>/dev/null || true)"
  if [ "$STASHED" != "$NEW_STASH" ] && [ -n "$NEW_STASH" ]; then
      STASHED=true
      N=$(echo "$TARGET" | grep -oE '[0-9]+' || echo 0)
      TARGET="stash@{$((N+1))}"
  else
      STASHED=false
  fi

  printf "Applying %s...\n" "$TARGET"
  git stash apply "$TARGET"

  printf "\nDiff after applying:\n"
  git -c color.ui=always status --short
  git diff --color=always || true

  printf '\nKeep changes? [Y/n/(p)reserve] '
  read -r ans2
  case "${ans2%% *}" in
    [yY]|'')
      git stash drop "$TARGET"
      ;;
    [pP])
      # Preserve: do nothing to the target stash
      ;;
    *)
      echo "Reverting stash..."
      git stash show -p "$TARGET" | git apply --reverse # kills script on fail
      ;;
  esac

  if $STASHED; then
      echo "Restoring previous working directory state..."
      git stash pop stash@{0}
  fi
  ;;
*)
  echo "### Reset HEAD to {1} ###\n"

  echo "--- File changes ---"
  git --no-pager diff --stat HEAD {1}
  echo

  echo "--- Commits ADDED ---"
  git --no-pager log --oneline HEAD..{1}
  echo

  echo "--- Commits REMOVED ---"
  git --no-pager log --oneline {1}..HEAD
  echo

  printf "Reset? [(M)ixed / (s)oft / (h)ard / (c)ancel ]: "
  read -r ans
  case "${ans%% *}" in
    [sS]*)
      git reset --soft {1}
      ;;
    [hH]*)
      git reset --hard {1}
      ;;
    [mM]*|"")
      git reset --mixed {1}
      ;;
    *)
      exit 100
      ;;
  esac
  ;;
esac
)'''

"@tag" = '''
BecomeOrConfirm(
set -e

case $MM_INDEX in
0|3)
  printf "Enter tag name for %s: " {1}
  read -r tag_name

  [ -n "$tag_name" ]
  delete="";
  remote=$(git rev-parse --abbrev-ref --symbolic-full-name @{u})

  if git rev-parse -q --verify "refs/tags/$tag_name" >/dev/null; then
    printf "Tag '%s' already exists. Remove it? [y/N] " "$tag_name"
    read -r ans

    case "$ans" in
      [yY]*)
        git tag -d "$tag_name"
        echo "Deleted local tag $tag_name"
        delete=--delete
        ;;
      *)
        exit 100
        ;;
    esac
  else
    git tag "$tag_name" {1}
    echo "Tagged {1} as $tag_name"
  fi

  printf "push tag '%s' to $remote? [y/(f)orce/N] " "$tag_name"
  read -r ans

  case "$ans" in
    [fF]*)
      git push --force $delete $remote "$tag_name"
      ;;
    [yY]*)
      git push $delete $remote "$tag_name"
      ;;
    *)
      exit 100
      ;;
  esac
  ;;
1)
  printf "Branch name for %s: " {1}
  read -r ans
  if [ -n "$ans" ]; then
    git stash branch "$ans" {1}
  fi
  ;;
2)
  printf "Branch name for reflog entry %s: " {1}
  read -r ans
  if [ -n "$ans" ]; then
    git branch "$ans" {1}
  fi
  ;;
esac
)'''

"@clean" = '''
ExecuteOrConfirm(
set -e

case $MM_INDEX in
0)
  if ((MM_SELECT_COUNT)) && command -v git-squash >/dev/null 2>&1; then
    set -- {+1}
    git-squash "$@" # git-squash will prompt
    exit 1 # keep output visible
  fi

  printf "Stash all changes to HEAD? [Y, n, or type custom message]: "
  read -r ans
  case "$ans" in
    [yY]|"")
      git stash
      ;;
    [nN])
      ;;
    *)
      git stash push -u -m "$ans"
      ;;
  esac
  ;;

1)
  git stash drop {1}
  ;;

2)
  printf "WARNING: Destructive action. Permanent data deletion.\n"
  printf "Proceed with full cleanup GC (expire reflogs)? [y/N] "
  read -r ans
  case "$ans" in
    [yY]*)
      echo "Purging history and running GC..."
      git -c gc.reflogExpire=0 -c gc.reflogExpireUnreachable=0 \
      -c gc.rerere.rresolved=0 -c gc.rerere.unresolved=0 \
      -c gc.pruneExpire=now gc
      false
      ;;
  esac
  ;;

3)
  printf "Run aggressive GC (recompress + remove old unreachable data)? [y/N] "
  read -r ans
  case "$ans" in
    [yY]*)
      git gc --prune=now --aggressive
      false
      ;;
  esac
  ;;

esac
)'''

"@fixup" = '''BecomeOrConfirm(
set -e

case "${MM_INDEX:-0}" in
  0) ;;
  1)
  echo "Commit message (\ -> continue): "
  msg=""
  while IFS= read -r line; do
    if [[ "$line" == *'\' ]]; then
      msg+="${line%?}"$'\n'
      printf "> "
    else
      msg+="$line"
      break
    fi
  done

  if [ -z "$msg" ]; then
    echo "Commit message cannot be empty."
    exit 1
  fi

  STASH_SHA="$(git rev-parse {1} 2>/dev/null)"
  git stash drop {1}
  git stash store -m "$msg" "$STASH_SHA"
  exit 100
  ;;
  *)
    echo "Unavailable (only works for commit history)"
    exit 1
    ;;
esac

PREV_HEAD="$(git rev-parse HEAD)"
COUNT="${MM_SELECT_COUNT:-0}"
TARGET_SHA="$(git rev-parse {1} 2>/dev/null || true)"
if [ -z "$TARGET_SHA" ]; then
  printf 'Could not resolve commit %s\n' {1}
  exit 1
fi
BASE_SHA="$TARGET_SHA"

MSG_FILE=""
ORIG_MSG_FILE=""
SEQ_EDITOR=""
trap 'rm -f "$MSG_FILE" "$ORIG_MSG_FILE" "$SEQ_EDITOR"' EXIT

# Rebase interactively from BASE_SHA's parent, or from the root commit.
# $1 is the sequence editor; remaining arguments go to `git rebase -i`.
rebase_rewrite() {
  seq_editor="$1"
  shift
  if git rev-parse --verify -q "$BASE_SHA^" >/dev/null 2>&1; then
    GIT_SEQUENCE_EDITOR="$seq_editor" git rebase -i "$@" "$BASE_SHA^"
  else
    GIT_SEQUENCE_EDITOR="$seq_editor" git rebase -i "$@" --root
  fi
}

rollback() {
  printf '%s failed. Rollback? [Y/n] ' "$1"
  read -r choice
  case "$choice" in
    [yY] | "") git rebase --abort 2>/dev/null || : ;;
    *) ;;
  esac
  exit 1
}

# Report the rewritten history, or resume silently when nothing changed.
report() {
  if [ "$(git rev-parse HEAD)" = "$PREV_HEAD" ]; then
    exit 100
  fi
  printf '\nSuccessfully %s\n' "$*"
  printf 'Previous HEAD was %s\n' "$PREV_HEAD"
  printf 'To restore previous HEAD: git reset --hard %s\n' "$PREV_HEAD"
}

if [ "$COUNT" -eq 0 ]; then
  # -------------------------------------------------------------
  # Nothing selected -> edit the message of the target commit
  # -------------------------------------------------------------
  MSG_FILE="$(mktemp "${TMPDIR:-/tmp}/git-msg.XXXXXX")"
  ORIG_MSG_FILE="$(mktemp "${TMPDIR:-/tmp}/git-msg.orig.XXXXXX")"
  git log -1 --format=%B "$TARGET_SHA" > "$ORIG_MSG_FILE"
  cp "$ORIG_MSG_FILE" "$MSG_FILE"

  ${VISUAL:-${EDITOR:-vi}} "$MSG_FILE"

  if [ ! -s "$MSG_FILE" ] || ! grep -q '[^[:space:]]' "$MSG_FILE" || cmp -s "$MSG_FILE" "$ORIG_MSG_FILE"; then
    exit 100
  fi

  if [ "$TARGET_SHA" = "$PREV_HEAD" ]; then
    git commit --allow-empty --amend -F "$MSG_FILE"
  else
    TARGET_SHORT="$(git rev-parse --short "$TARGET_SHA")"
    SEQ_EDITOR="$(mktemp "${TMPDIR:-/tmp}/git-seq-editor.XXXXXX")"
    cat << EOF > "$SEQ_EDITOR"
#!/bin/sh
sed -i.bak "s/^pick $TARGET_SHORT/edit $TARGET_SHORT/" "\$1" && rm -f "\$1.bak"
EOF
    chmod +x "$SEQ_EDITOR"

    if ! rebase_rewrite "$SEQ_EDITOR"; then
      rollback "Rebase"
    fi

    git commit --allow-empty --amend -F "$MSG_FILE"
    if ! GIT_EDITOR=true git rebase --continue; then
      rollback "Rebase continue"
    fi
  fi

  report "updated the message of" {1}

elif [ "$COUNT" -eq 1 ]; then
  # -------------------------------------------------------------
  # One commit selected -> fold the working tree into it
  # -------------------------------------------------------------
  TARGET_SHA="$(git rev-parse {+1})"
  if [ -z "$(git status --porcelain)" ]; then
    exit 100
  fi

  git add -A

  if [ "$TARGET_SHA" = "$PREV_HEAD" ]; then
    git commit --amend --no-edit --no-verify
  else
    git commit --no-verify --fixup="$TARGET_SHA"
    if ! rebase_rewrite true --autosquash; then
      rollback "Amend"
    fi
  fi

  report "amended" {+1}

else
  # -------------------------------------------------------------
  # Several commits selected -> reorder them so the selection order
  # (first selected = oldest) becomes their order in history
  # -------------------------------------------------------------
  # Resolve the selection to full hashes in selection order (word-split
  # into positional parameters on purpose).
  set -- $(git rev-parse {+1} 2>/dev/null || true)
  if [ "$#" -eq 0 ]; then
    exit 100
  fi

  # Selected commits in ascending history order; the first is the rebase base.
  FOUND=0
  SELECTED_ASC=""
  for c in $(git rev-list --reverse HEAD); do
    case " $* " in
      *" $c "*) ;;
      *) continue ;;
    esac
    if [ "$FOUND" -eq 0 ]; then
      BASE_SHA="$c"
    fi
    FOUND=$((FOUND + 1))
    SELECTED_ASC="${SELECTED_ASC:+$SELECTED_ASC }$c"
  done

  if [ "$FOUND" -ne "$#" ]; then
    echo "Selection is not part of HEAD's history"
    exit 1
  fi
  if [ "$SELECTED_ASC" = "$*" ]; then
    echo "Selection is already in history order"
    exit 100
  fi

  # Rewrite the todo list so each selected slot gets the next selection.
  SEQ_EDITOR="$(mktemp "${TMPDIR:-/tmp}/git-seq-editor.XXXXXX")"
  {
    printf "#!/bin/sh\nSEL='%s'\n" "$*"
    cat << 'EOF'
awk -v sel="$SEL" '
BEGIN { n = split(sel, sel_arr, " ") }
{ lines[NR] = $0 }
($1 == "pick" || $1 == "p") && NF >= 2 {
    for (i = 1; i <= n; i++)
        if (index(sel_arr[i], $2) == 1) {
            slots[++ns] = NR
            picked[i] = $0
            break
        }
}
END {
    if (ns != n) {
        print "selected commits missing from the rebase todo" > "/dev/stderr"
        exit 1
    }
    for (i = 1; i <= ns; i++) lines[slots[i]] = picked[i]
    for (i = 1; i <= NR; i++) print lines[i]
}
' "$1" > "$1.tmp" && mv "$1.tmp" "$1"
EOF
  } > "$SEQ_EDITOR"
  chmod +x "$SEQ_EDITOR"

  if ! rebase_rewrite "$SEQ_EDITOR"; then
    rollback "Reorder"
  fi

  report "reordered commits"
fi
)'''
