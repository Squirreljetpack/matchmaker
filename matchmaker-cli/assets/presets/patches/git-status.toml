# git-status patch to open files at their changed line

base = ""

[binds]
"@open" = [
    '''
Execute(
  file={file}
  [[ "$MM_PREVIEW_INDEX" == "1" ]] && flags="--cached" || flags=""
  line=$(git diff --no-ext-diff $flags --unified=0 -- "$file" | awk '/^@@/ {
    old = $2; sub(/^-/, "", old); sub(/,.*/, "", old)
    new = $3; sub(/^\+/, "", new); sub(/,.*/, "", new)
    if (new != "" && new != "0") {
      print new
    } else {
      print old
    }
    exit
  }')
  if [ -n "$line" ] && [ "$line" -gt 0 ] 2>/dev/null; then
    $EDITOR "+$line" "$file"
  else
    $EDITOR "$file"
  fi
)
''',
    "Reload",
]

"@open_2" = '''
Become(
  file={file}
  [[ "$MM_PREVIEW_INDEX" == "1" ]] && flags="--cached" || flags=""
  line=$(git diff --no-ext-diff $flags --unified=0 -- "$file" | awk '/^@@/ {
