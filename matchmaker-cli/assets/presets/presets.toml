# Preset picker

[start]
command = '''
dir="$(dirname -- "$MM_OVERRIDE")"
mm --presets | while IFS= read -r p; do
    name="${p#"$dir"/}"
    case "$name" in
        */main.toml)
            name="${name%/main.toml}"
            ;;
        *.toml)
            name="${name%.toml}"
            ;;
    esac
    printf '%s\0%s\n' "$p" "$name"
done
'''
output = "{=path}"
directory = { value = 'dirname -- "$MM_OVERRIDE"', exec = true, force = true }

[binds]
"@accept" = '''Become(
set -- {+path}
if [ "$#" -eq 1 ]; then
    dir="$(dirname -- "$MM_OVERRIDE")"
    name={name}
    patch="$dir/patches/${name//\//-}.toml"
    [ -f "$patch" ] && set -- "$1" "$patch"
fi
args=()
for p; do args+=(-o "$p"); done
mm "${args[@]}"
)'''
"@return" = "Accept"

[columns]
split = "\\x00"
max = 2
default = "name"
names = [{ name = "path", hidden = true }, "name"]
