# Preset picker

[start]
command = '''
dir="$(dirname -- "$MM_OVERRIDE")"
mm --presets | while IFS= read -r p; do
    name="${p#"$dir"/}"
    # drop this platform's prefix (`unix.`, `macos.`, `linux.`) from the file
    # name, so the picker shows the name `-o` takes
    sub="${name%/*}"; [ "$sub" = "$name" ] && sub=""
    base="${name##*/}"
    prefix="${base%%.*}."
    case "$prefix" in
        win.|windows.|macos.|linux.|unix.) base="${base#"$prefix"}" ;;
    esac
    if [ -n "$sub" ]; then name="$sub/$base"; else name="$base"; fi
    case "$name" in
        themes/main.toml)
            name="themes"
            ;;
        themes/*)
            continue
            ;;
        */main.toml)
            name="${name%/main.toml}"
            ;;
        *.toml)
            name="${name%.toml}"
            ;;
    esac
    printf '%s\0%s\n' "$p" "$name"
done
'''
output = "{=file}"
directory = { value = 'dirname -- "$MM_OVERRIDE"', exec = true, force = true }

[binds]
"@accept" = '''Become(
set -- {+file}
if [ "$#" -eq 1 ]; then
    dir="$(dirname -- "$MM_OVERRIDE")"
    name={name}
    patch="$dir/patches/${name//\//-}.toml"
    [ -f "$patch" ] && set -- "$1" "$patch"
fi
args=()
for p; do args+=(-o "$p"); done
mm "${args[@]}"
)'''
"@return" = "Accept"

[columns]
split = "\\x00"
max = 2
default = "name"
names = [{ name = "file", hidden = true }, "name"]
