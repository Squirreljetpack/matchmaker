# Find and kill processes

[matcher]
ansi = false
trim = true

[start]
command = "ps -eo pgid,pid,user,%cpu,vsz,rss,etime,stat,command"
additional_commands = [
    "",
    "lsof -nP -i",
]

[envs]
PS_KILL = '''
# usage: eval "$PS_KILL" [-g] SIGNAL
# (the signal args are appended to the trailing mm_kill call)
# Signals each PID in $pids (or its process group with -g), then waits up to
# $MM_KILL_TIMEOUT seconds (default 1) for each to disappear.
# A process left in state Z counts as gone.
# Surviving PIDs are stored in failed and reported.
mm_kill() {
    group=0
    [ "$1" = "-g" ] && { group=1; shift; }
    sig=$1
    wait=$(( ${MM_KILL_TIMEOUT:-1} * 20 ))

    pending=""
    failed=""
    for p in $pids; do
        target=$p
        if [ "$group" -eq 1 ]; then
            pgid=$(ps -o pgid= -p "$p" 2>/dev/null | tr -d ' ')
            [ -z "$pgid" ] && continue
            target="-$pgid"
        fi
        if kill "-$sig" -- "$target" 2>/dev/null; then
            pending="${pending}${pending:+ }$p"
        else
            # delivery failed: an empty/Z state means the target is already gone
            st=$(ps -o stat= -p "$p" 2>/dev/null)
            case $st in ""|Z*) ;; *) failed="${failed}${failed:+ }$p" ;; esac
        fi
    done

    i=0
    while [ -n "$pending" ] && [ "$i" -lt "$wait" ]; do
        next=""
        for p in $pending; do
            st=$(ps -o stat= -p "$p" 2>/dev/null)
            case $st in ""|Z*) ;; *) next="${next}${next:+ }$p" ;; esac
        done
        pending=$next
        [ -n "$pending" ] || break
        sleep 0.05
        i=$((i + 1))
    done

    for p in $pending; do
        failed="${failed}${failed:+ }$p"
    done
    [ -z "$failed" ] || {
        echo "Failed: $failed"
        return 1
    }
}
mm_kill'''

[header]
header_lines = 1
content = '[procs]'
style.modifier = ""

[columns]
split = ' +'
max = 9
default = 9

# --- Preview ---
[preview]
# show = false
wrap = false
trim_ends = true

[[preview.layout]]
# Tree view
command = '''
os=$(uname -s)
if command -v pstree >/dev/null 2>&1; then
    case $os in
        Darwin) pstree -p {2} ;;
        *) pstree -ap {2} ;;
    esac
elif ps --version 2>/dev/null | grep -q procps; then
    ps -f --forest -p {2}
else
    case $os in
        Darwin) args=,wq ;;
        *) args=,thcount ;;
    esac

    ps -ww -eo user,pid,ppid,pgid,sess,tty,lstart,time,rss,vsz,pcpu,pmem,stat$args,command {2}
fi
'''
border = { title = "Process Tree" }

[[preview.layout]]
command = "top -b -p {2} 2>/dev/null || top -pid {2}"
border = { title = "Resources" }
initial.tail = true
min = 13

[[preview.layout]]
command = "lsof -p {2}"
border = { title = "Open Ports" }

[binds]
"Reloaded" = '''Transform(
    HEADERS='[procs]
[ports]'
    i=0
    for h in $HEADERS; do
        [ "$i" -eq "${MM_INDEX:-0}" ] && echo "SetHeader($h)"
        i=$((i + 1))
    done
)
'''
"@reload_2" = []

"@accept" = ["#print pid", "Become(printf '%s\n' {+2})"]
"@return" = ["#print active", "Become(printf '%s\n' {+!})"]
"@copy" = "CopyAsync(printf '%s\n' {+2})"
"@show" = "RunPreview(echo {9})"

"ctrl-k" = [
    "#kill",
    '''ExecuteOrConfirm(
        pids="{-2}"
        set -- $pids
        [ $# -gt 1 ] && {
            printf "Kill: %s [y/N] " "$pids"
            read -r reply
            case $reply in [yY]*) ;; *) exit 0 ;; esac
        }

        eval "$PS_KILL" TERM
    )''',
    "Reload",
]

"alt-k" = [
    "#kill -9",
    '''ExecuteOrConfirm(
        pids="{-2}"
        set -- $pids
        [ $# -gt 1 ] && {
            printf "Kill: %s [y/N] " "$pids"
            read -r reply
            case $reply in [yY]*) ;; *) exit 0 ;; esac
        }

        eval "$PS_KILL" KILL
    )''',
    "Reload",
]

