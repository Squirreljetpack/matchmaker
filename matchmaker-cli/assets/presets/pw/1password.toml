# 1Password vault picker (op)

source = "base.toml"

[start]
command = '''
command -v op >/dev/null 2>&1 || { echo "op not found" >&2; exit 1; }
command -v jq >/dev/null 2>&1 || { echo "jq not found" >&2; exit 1; }
op item list --format json | jq -r '.[] | "\(.id)\t\(.title // "")\t\(.additional_information // "")\t\(.vault.name // "")"'
'''
output = "{=id}"

[query]
prompt = "1password> "

# --- Preview ---

[[preview.layout]]
command = '''
op item get {id} --format json | jq -r '
    "Title:    \(.title // "")",
    "Category: \(.category // "")",
    "Vault:    \(.vault.name // "")",
    (if ((.urls // []) | length) > 0 then
        "URLs:     \((.urls | map(.href) | join(", ")))"
    else empty end),
    "---",
    ((.fields // [])[] |
        select((.value // "") != "" and .id != "notesPlain") |
        "\(.label // .id): \(if .type == "CONCEALED" or .type == "OTP" then "********" else .value end)"
    )
'
'''
frame = { title = "Entry" }

[[preview.layout]]
command = '''
op item get {id} --format json | jq -r '
    "Notes:",
    ((.fields // [])[] | select(.id == "notesPlain") | .value // "-")
'
'''
frame = { title = "Notes" }

# --- Binds ---

[binds]
"@accept" = [
    "#copy password and quit",
    '''Copy(
        (sleep 15; if command -v wl-copy >/dev/null 2>&1; then wl-copy --clear; elif command -v pbcopy >/dev/null 2>&1; then printf '' | pbcopy; elif command -v xclip >/dev/null 2>&1; then printf '' | xclip -selection clipboard; fi) >/dev/null 2>&1 </dev/null &
        op item get {id} --fields password --reveal
    )''',
    "Quit(0)",
]
"@copy" = [
    "#copy password",
    '''CopyAsync(
        (sleep 15; if command -v wl-copy >/dev/null 2>&1; then wl-copy --clear; elif command -v pbcopy >/dev/null 2>&1; then printf '' | pbcopy; elif command -v xclip >/dev/null 2>&1; then printf '' | xclip -selection clipboard; fi) >/dev/null 2>&1 </dev/null &
        op item get {id} --fields password --reveal
    )''',
]
"@copy_user" = ["#copy username", "CopyAsync(op item get {id} --fields username)"]
"@copy_otp" = ["#copy TOTP", "CopyAsync(op item get {id} --otp)"]
"@open" = [
    "#open URL",
    '''ExecuteOrConfirm(
        url=$(op item get {id} --format json | jq -r '.urls[0].href // empty')
        if [ -n "$url" ]; then
            if command -v xdg-open >/dev/null 2>&1; then xdg-open "$url" >/dev/null 2>&1 &
            elif command -v open >/dev/null 2>&1; then open "$url" >/dev/null 2>&1 &
            fi
        else
            echo "No URL found for "{name} >&2
            exit 1
        fi
    )''',
]
"@show" = [
    "#reveal entry",
    '''RunPreview(
        op item get {id} --format json --reveal | jq -r '
            "Title:    \(.title // "")",
            ((.fields // [])[] | select((.value // "") != "") | "\(.label // .id): \(.value)")
        '
    )''',
]
