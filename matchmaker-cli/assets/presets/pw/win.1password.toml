# 1Password vault picker (op)

source = "base.toml"

[start]
command = '''#!lua
if not proc.has("op") then error("op not found") end
local r = proc.run("op", { "item", "list", "--format", "json" })
if not r.ok then error("op item list failed: " .. r.stderr) end
for _, item in ipairs(util.json_decode(r.stdout)) do
  inject(table.concat({
    item.id,
    item.title or "",
    item.additional_information or "",
    (item.vault or {}).name or "",
  }, "\t"))
end'''
output = "{=id}"

[query]
prompt = "1password> "

# --- Preview ---

[[preview.layout]]
command = '''
$item = op item get {id} --format json | ConvertFrom-Json
Write-Output "Title:    $($item.title)"
Write-Output "Category: $($item.category)"
Write-Output "Vault:    $($item.vault.name)"
if ($item.urls) {
    Write-Output ("URLs:     " + (($item.urls | ForEach-Object { $_.href }) -join ', '))
}
Write-Output '---'
foreach ($field in $item.fields) {
    if (-not $field.value) { continue }
    if ($field.id -eq 'notesPlain') { continue }
    $label = if ($field.label) { $field.label } else { $field.id }
    if ($field.type -eq 'CONCEALED' -or $field.type -eq 'OTP') {
        Write-Output "${label}: ********"
    } else {
        Write-Output "${label}: $($field.value)"
    }
}
'''
frame = { title = "Entry" }

[[preview.layout]]
command = '''
$item = op item get {id} --format json | ConvertFrom-Json
Write-Output 'Notes:'
$note = ($item.fields | Where-Object { $_.id -eq 'notesPlain' } | Select-Object -First 1).value
if ($note) { Write-Output $note } else { Write-Output '-' }
'''
frame = { title = "Notes" }

# --- Binds ---

[binds]
"@accept" = [
    "#copy password and quit",
    '''Copy(#!lua
local cur = state.current
if not cur then return end
local r = proc.run("op", { "item", "get", cur.id, "--fields", "password", "--reveal" })
if not r.ok then error(r.stderr) end
proc.spawn("powershell", { "-NoProfile", "-Command", "Start-Sleep -Seconds 15; Set-Clipboard -Value ''" })
return r.stdout
)''',
    "Quit(0)",
]
"@copy" = [
    "#copy password",
    '''CopyAsync(#!lua
local cur = state.current
if not cur then return end
local r = proc.run("op", { "item", "get", cur.id, "--fields", "password", "--reveal" })
if not r.ok then error(r.stderr) end
proc.spawn("powershell", { "-NoProfile", "-Command", "Start-Sleep -Seconds 15; Set-Clipboard -Value ''" })
return r.stdout
)''',
]
"@copy_user" = [
    "#copy username",
    '''CopyAsync(#!lua
local cur = state.current
if not cur then return end
local r = proc.run("op", { "item", "get", cur.id, "--fields", "username" })
if not r.ok then error(r.stderr) end
return r.stdout
)''',
]
"@copy_otp" = [
    "#copy TOTP",
    '''CopyAsync(#!lua
local cur = state.current
if not cur then return end
local r = proc.run("op", { "item", "get", cur.id, "--otp" })
if not r.ok then error(r.stderr) end
return r.stdout
)''',
]
"@open" = [
    "#open URL",
    '''ExecuteOrConfirm(#!lua
local cur = state.current
if not cur then return end
local r = proc.run("op", { "item", "get", cur.id, "--format", "json" })
if not r.ok then error(r.stderr) end
local urls = util.json_decode(r.stdout).urls
local url = urls and urls[1] and urls[1].href
if not url then error("No URL found for " .. (cur.name or "")) end
proc.spawn("powershell", { "-NoProfile", "-Command", "Start-Process '" .. url:gsub("'", "''") .. "'" })
)''',
]
"@show" = [
    "#reveal entry",
    '''RunPreview(
$item = op item get {id} --format json --reveal | ConvertFrom-Json
Write-Output "Title:    $($item.title)"
foreach ($field in $item.fields) {
    if (-not $field.value) { continue }
    $label = if ($field.label) { $field.label } else { $field.id }
    Write-Output "${label}: $($field.value)"
}
)''',
]
