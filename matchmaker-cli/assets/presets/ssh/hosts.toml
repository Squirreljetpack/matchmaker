# ssh host selector

[start]
# Not a perfect parse if host definitions are fragmented
command = '''
{
    setopt +o nomatch 2>/dev/null

    set --
    for f in "$HOME/.ssh/config" "$HOME/.ssh/config.d/"* "/etc/ssh/ssh_config"; do
        [ -f "$f" ] && [ -r "$f" ] && set -- "$@" "$f"
    done

    if [ $# -gt 0 ]; then
        awk '
            function print_hosts(   j, out_host, out_hostname) {
                for (j = 1; j <= host_count; j++) {
                    out_host = host_list[j]
                    if (out_host in seen) continue
                    seen[out_host] = 1

                    out_hostname = (hostname == "-") ? out_host : hostname

                    # Using printf with null byte \x00 via %c for portability
                    printf "%s%c%s%c%s%c%s%c%s\n",
                           file, 0, out_host, 0, out_hostname, 0, user, 0, port
                }
            }

            function reset_block() {
                host_count = 0
                hostname = "-"
                user = "-"
                port = "-"
            }

            FILENAME != file {
                if (host_count > 0) { print_hosts() }
                file = FILENAME
                reset_block()
            }

            $1 ~ /^[Hh][Oo][Ss][Tt]$/ {
                if (host_count > 0) { print_hosts() }
                reset_block()

                for (i = 2; i <= NF; i++) {
                    if ($i !~ /[*?]/) {
                        host_list[++host_count] = $i
                    }
                }
                next
            }

            $1 ~ /^[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]$/ { hostname = $2; next }
            $1 ~ /^[Uu][Ss][Ee][Rr]$/                 { user = $2; next }
            $1 ~ /^[Pp][Oo][Rr][Tt]$/                 { port = $2; next }

            END {
                if (host_count > 0) { print_hosts() }
            }
        ' "$@"
    fi
} | sort
'''

[columns]
split = "\\x00"
max = 5
default = "host"
names = [{ name = "file", hidden = true }, "host", "address", "user", "port"]

# --- Preview ---
[preview]
show = false

[[preview.layout]]
command = "ssh -G {host}"
frame = { title = "SSH Config" }

[[preview.layout]]
command = "(nc -w 5 -vz {host} 22 2>&1)&!; ping -c 3 -W 1000 {host}"
frame = { title = "Connectivity" }

[[preview.layout]]
command = "ssh-keyscan {host}"
frame = { title = "Host Keys" }

# --- UI ---
[header]
content = ["file", "host", "address", "user", "port"]

[query]
prompt = "hosts> "

[binds]
"ctrl-t" = ["@test", "Reload"]
"alt-t" = ["@test", "Reload"]

"@accept" = ["#ssh", "Become(ssh {host})"]
"@return" = "Become(echo {host})"
"@open_2" = "Become($EDITOR {file})"
"@next" = "BecomeSilent(mm -o ssh/keys)"
"@prev" = "BecomeSilent(mm -o ssh/tailscale)"

# --- Scripts ---
"@test" = "Execute(ssh -vT {host} 2>&1)"

[tui]
percentage = 100
