# Mutagen sync session picker

# Lists mutagen sync sessions (one session name per row).
# Previews show session sync status and detailed configuration.

[matcher]
trim = true

[start]
command = "mutagen sync list --template '{{range $i, $e := .}}{{if $i}}{{\"\\n\"}}{{end}}{{if .Name}}{{.Name}}{{else}}{{.Identifier}}{{end}}{{end}}'"

[exit]
abort_empty = false

[columns]
split = "tsv"
default = "name"
names = [
    { name = "name" },
]

# --- Preview ---------------------------------------------------------------
[preview]
wrap = false
show = true

[[preview.layout]]
command = 'mutagen sync list {name}'
border = { title = "Status" }

[[preview.layout]]
command = 'mutagen sync monitor {name}'
border = { title = "Mutagen Sync Monitor" }
initial.tail = true

[[preview.layout]]
command = 'mutagen sync list -l {name}'
border = { title = "Details" }

# --- UI --------------------------------------------------------------------
[header]
content = ["SESSION"]
style.modifier = ""

[query]
prompt = "mutagen> "
prompt_style.fg = "Cyan"

[tui]
percentage = 100

# --- Binds -----------------------------------------------------------------
[binds]
"@show" = [
    "#show detailed info",
    'ShowPreview(mutagen sync list -l {name})',
]

"@copy_all" = [
    "#copy conflicts",
    '''CopyAsync(mutagen sync list {+name} --template '{{range .}}{{range .SessionState.Conflicts}}{{if .Root}}{{.Root}}{{"\n"}}{{end}}{{range .AlphaChanges}}{{if .Path}}{{.Path}}{{"\n"}}{{end}}{{end}}{{range .BetaChanges}}{{if .Path}}{{.Path}}{{"\n"}}{{end}}{{end}}{{end}}{{end}}')''',
]

"@flush" = [
    "#flush (force sync)",
    'ExecuteOrConfirm(mutagen sync flush {+name})',
    "Reload",
]

"@pause" = [
    "#pause sync",
    'ExecuteOrConfirm(mutagen sync pause {+name})',
    "Reload",
]

"@resume" = [
    "#resume sync",
    'ExecuteOrConfirm(mutagen sync resume {+name})',
    "Reload",
]

"@reset" = [
    "#reset (rescan without merge state)",
    'ExecuteOrConfirm(mutagen sync reset {+name})',
    "Reload",
]

"@rm" = [
    "#terminate session",
    '''ExecuteOrConfirm(
names=({+name})
if [ ${#names[@]} -eq 1 ]; then
    printf "Terminate sync session %s? [Y/n]: " "${names[@]}"
else
    printf "Terminate %s sync sessions?\n" "${#names[@]}"
    printf '    %s\n' "${names[@]}"
    printf '[Y/n]: '
fi
read -r ans
case "$ans" in
    [Yy]*|'') mutagen sync terminate "${names[@]}" ;;
    *) exit 0 ;;
esac
)''',
    "Reload",
]

"@clean" = [
    "#clean ignored files in deleted folders",
    '''ExecuteOrConfirm("$(dirname -- "$MM_OVERRIDE")"/mutagen_resolve.py --clean-untracked {+name})''',
    "Reload",
]

"@resolve" = [
    "#resolve conflicts (interactive)",
    '''ExecuteOrConfirm("$(dirname -- "$MM_OVERRIDE")"/mutagen_resolve.py {+name})''',
    "Reload",
]

"ctrl-s" = "@show"
"alt-f" = "@flush"
"alt-p" = "@pause"
"alt-r" = "@resume"
"alt-shift-r" = "@reset"
"alt-c" = "@clean"
"alt-v" = "@resolve"
"ctrl-d" = "@rm"
