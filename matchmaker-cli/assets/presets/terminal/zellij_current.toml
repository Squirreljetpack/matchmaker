# Focus a pane of the current zellij session

[matcher]
trim = true

[start]
command = "@./zellij.sh current"

[exit]
abort_empty = false

[envs]
CATcmd = { value = 'command -v bat --wrap=never --color=always -pp >/dev/null 2>&1 && echo bat || echo cat', exec = true, force = true }

[columns]
split = "tsv"
max = 5
default = "title"
names = [
    { name = "age", options = "Optional | OrUseDefault" },
    { name = "session", hidden = true },
    { name = "pane", hidden = true },
    { name = "tab" },
    { name = "title", options = "Optional | OrUseDefault" },
]

# --- Preview ---------------------------------------------------------------
[preview]
wrap = false
show = true

# live screen of the selected pane
[[preview.layout]]
side = "top"
percentage = 55
min = 5
max = 50
border.type = "Plain"
command = '''
zellij action dump-screen --pane-id {pane} 2>/dev/null || true
'''

# stubs disabling the base config preview layouts
[[preview.layout]]
max = 0

[[preview.layout]]
max = 0

# --- UI --------------------------------------------------------------------
[header]
content = ["AGE", "SESSION", "PANE", "TAB", "TITLE"]
style.modifier = ""

[query]
prompt = "current> "
prompt_style.fg = "Cyan"

[tui]
percentage = 100

# --- Binds -----------------------------------------------------------------
[binds]
"@accept" = 'Become(zellij action focus-pane-id {pane})'
"@return" = "Accept"

"@print" = [
    "#print",
    '''Become(
set -- {+pane}
for s in {+session}; do
    printf '%s\t%s\n' "$s" "$1"
    shift
done
)''',
]

"@copy" = '''CopyAsync(
set -- {+pane}
for s in {+session}; do
    printf '%s:%s\n' "$s" "$1"
    shift
done
)'''

"@rm" = [
    "#kill",
    '''ExecuteOrConfirm(
titles=({+title})
panes=({+pane})
if [ ${#panes[@]} -eq 1 ]; then
    printf "Close pane: %s? [Y/n]: " "${titles[@]}"
else
    printf "Close %s panes?\n" "${#panes[@]}"
    printf '    %s\n' "${titles[@]}"
    printf '[Y/n]: '
fi
read -r
case "$REPLY" in
    [Yy]*|'') ;;
    *) exit 0 ;;
esac
f=()
for p in "${panes[@]}"; do
    zellij action close-pane --pane-id "$p" 2>/dev/null || f+=("$p")
done
if [ ${#f[@]} -ne 0 ]; then
    echo "Failed: ${f[*]}"
    exit 1
fi
exit 0
)''',
    "Reload",
]

# ring navigation
"@next" = "BecomeSilent(mm -o terminal/zellij_layout)"
"@prev" = "BecomeSilent(mm -o terminal/zellij_session)"
