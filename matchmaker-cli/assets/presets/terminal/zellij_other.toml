# Focus a pane in another zellij session

[matcher]
trim = true

[start]
command = "@./zellij.sh other"

[exit]
abort_empty = false

[envs]
CATcmd = { value = 'command -v bat --wrap=never --color=always -pp >/dev/null 2>&1 && echo bat || echo cat', exec = true, force = true }

[columns]
split = "tsv"
max = 5
default = "session"
names = [
    { name = "age", options = "Optional | OrUseDefault" },
    { name = "session", options = "Optional" },
    { name = "pane", hidden = true },
    { name = "tab" },
    { name = "title", options = "Optional | OrUseDefault" },
]

# --- Preview ---------------------------------------------------------------
[preview]
wrap = false
show = true

# live screen of the selected pane
[[preview.layout]]
side = "top"
percentage = 55
min = 5
max = 50
border.type = "Plain"
command = '''
zellij -s {session} action dump-screen --pane-id {pane} 2>/dev/null || true
'''

# stubs disabling the base config preview layouts
[[preview.layout]]
max = 0

[[preview.layout]]
max = 0

# --- UI --------------------------------------------------------------------
[header]
content = ["AGE", "SESSION", "PANE", "TAB", "TITLE"]
style.modifier = ""

[query]
prompt = "other> "
prompt_style.fg = "Cyan"

[tui]
percentage = 100

# --- Binds -----------------------------------------------------------------
[binds]
"@accept" = '''Become(
if [ -n "$ZELLIJ" ] || [ -n "$ZELLIJ_SESSION_NAME" ]; then
    exec zellij action switch-session --pane-id {pane} {session}
else
    zellij -s {session} action focus-pane-id {pane} >/dev/null 2>&1
    exec zellij attach {session}
fi
)'''
"@return" = "Accept"

"@print" = [
    "#print",
    '''Become(
set -- {+pane}
for s in {+session}; do
    printf '%s\t%s\n' "$s" "$1"
    shift
done
)''',
]

"@copy" = '''CopyAsync(
set -- {+pane}
for s in {+session}; do
    printf '%s:%s\n' "$s" "$1"
    shift
done
)'''

"@rm" = [
    "#kill",
    '''ExecuteOrConfirm(
set -- {+title}
labels=()
for s in {+session}; do
    labels+=("$1 ($s)")
    shift
done
if [ ${#labels[@]} -eq 1 ]; then
    printf "Close pane: %s? [Y/n]: " "${labels[@]}"
else
    printf "Close %s panes?\n" "${#labels[@]}"
    printf '    %s\n' "${labels[@]}"
    printf '[Y/n]: '
fi
read -r
case "$REPLY" in
    [Yy]*|'') ;;
    *) exit 0 ;;
esac
set -- {+session}
f=()
for p in {+pane}; do
    zellij -s "$1" action close-pane --pane-id "$p" 2>/dev/null || f+=("$1:$p")
    shift
done
if [ ${#f[@]} -ne 0 ]; then
    echo "Failed: ${f[*]}"
    exit 1
fi
exit 0
)''',
    "Reload",
]

# kill the sessions of the selected panes (deduplicated, since several panes
# may belong to the same session)
"alt-d" = [
    "#kill session",
    '''ExecuteOrConfirm(
sessions=($(printf '%s\n' {+session} | sort -u))
if [ ${#sessions[@]} -eq 1 ]; then
    printf "Kill session: %s? [Y/n]: " "${sessions[@]}"
else
    printf "Kill %s sessions?\n" "${#sessions[@]}"
    printf '    %s\n' "${sessions[@]}"
    printf '[Y/n]: '
fi
read -r
case "$REPLY" in
    [Yy]*|'') ;;
    *) exit 0 ;;
esac
f=()
for s in "${sessions[@]}"; do
    zellij kill-session "$s" 2>/dev/null || f+=("$s")
done
if [ ${#f[@]} -ne 0 ]; then
    echo "Failed: ${f[*]}"
    exit 1
fi
exit 0
)''',
    "Reload",
]

# ring navigation
"@next" = "BecomeSilent(mm -o terminal/zellij_session)"
"@prev" = "BecomeSilent(mm -o terminal/zellij_layout)"
