# Attach to (or resurrect) a zellij session
# Usage: mm -o multiplexer/zellij_session
#
# Parses `zellij list-sessions` keeping its ANSI colors (matcher.ansi = true):
# matchmaker renders them in the results list, while matching, columns and
# templates operate on the plain text underneath.
#
# Row columns: name | age | status (EXITED, or empty when the session is running)
# Preview 1 (top): session metadata - status, base cwd, tabs, layout location
# Preview 2 (right): the saved session layout from
#   ~/.cache/zellij/<version>/session_info/<name>/session-layout.kdl
#   displayed through $CATcmd (bat when available, else cat)

[matcher]
ansi = true
trim = true
sort.threshold = 20
sort.reverse = true

[start]
command = "zellij list-sessions --no-formatting"

[envs]
CATcmd = { value = 'command -v bat >/dev/null 2>&1 && echo bat || echo cat', exec = true, force = true }

[columns]
split = '^(?P<name>.*?) \[Created (?P<age>.*?) ago\](?: \((?P<status>[^)]*)\))?$'
max = 3
default = "name"
names = ["name", "age", "status"]

# --- Preview: session metadata ---
[preview]
wrap = true

[[preview.layout]]
command = '''
cache="${XDG_CACHE_HOME:-$HOME/.cache}/zellij"
kdl="$cache/contract_version_1/session_info/{=name}/session-metadata.kdl"
eval $CATcmd "'$kdl'"
'''

[[preview.layout]]
command = '''
cache="${XDG_CACHE_HOME:-$HOME/.cache}/zellij"
kdl="$cache/contract_version_1/session_info/{=name}/session-layout.kdl"
eval $CATcmd "'$kdl'"
'''
side = "right"
percentage = 45
min = 30
max = 120
border.type = "Plain"
border.padding = [2, 0]

# --- UI ---
[header]
content = ["name", "age", "status"]

[query]
prompt = "sessions> "
prompt_style.fg = "Cyan"

[tui]
percentage = 100

[binds]
"@accept" = "Become(zellij attach {1})"
"@accept_2" = ["#print name", "Become(printf '%s\\n' {name})"]
"@copy" = "CopyAsync(printf '%s\\n' {name})"
"@kill" = ["#kill session", '''ExecuteOrConfirm(
        printf "Kill session %s? [y/N] " {name}
        read -r ans
        case "$ans" in
            [yY]*) zellij kill-session {name} ;;
            *) exit 0 ;;
        esac
    )''', "Reload"]
