# Switch between zellij sessions

# Preview (hidden by default) shows a tab summary with pane titles

[matcher]
trim = true
sort_threshold = 0

[start]
command = "@./zellij.sh sessions"

[exit]
abort_empty = false

[envs]
CATcmd = { value = 'command -v bat >/dev/null 2>&1 && echo bat --wrap=never --color=always -pp || echo cat', exec = true, force = true }
ZELLIJ_CACHE_DIR = { value = 'zellij setup --check 2>/dev/null | sed -n "s/^\\[CACHE DIR\\]: *//p" | tr -d "\"\\r"', exec = true, force = true }

[columns]
split = "tsv"
max = 5
default = "session"
names = [
    { name = "age", options = "Optional | OrUseDefault" },
    { name = "session", options = "Optional" },
    { name = "pane", hidden = true },
    { name = "tab", hidden = true },
    { name = "title", options = "Optional | OrUseDefault" },
]

# --- Preview ---------------------------------------------------------------
[preview]
wrap = false
show = true

# tab summary with pane titles (live for running, cached for EXITED)
[[preview.layout]]
command = '''"$(dirname -- "$MM_OVERRIDE")"/zellij.sh session-preview {session} {title} {age}'''

# active pane screen for running sessions, cached layout/metadata KDL for EXITED
[[preview.layout]]
command = '''
if [ {title} != "EXITED" ]; then
    "$(dirname -- "$MM_OVERRIDE")"/zellij.sh dump-pane {session} 2>/dev/null && exit 0
fi
cache="${ZELLIJ_CACHE_DIR:-${XDG_CACHE_HOME:-$HOME/.cache}/zellij}"
for dir in "$cache"/*/; do
    if [ -f "$dir/session_info/{session}/session-layout.kdl" ]; then
        $CATcmd "$dir/session_info/{session}/session-layout.kdl" && exit 0
    fi
done
'''

# stub disabling the third base config preview layout
[[preview.layout]]
max = 0

# --- UI --------------------------------------------------------------------
[header]
content = ["AGE", "SESSION", "PANE", "TAB", "STATE"]
style.modifier = ""

[query]
prompt = "session> "
prompt_style.fg = "Cyan"

[tui]
percentage = 100

# --- Binds -----------------------------------------------------------------
[binds]
"@accept" = '''Become(
if [ -n "$ZELLIJ" ] || [ -n "$ZELLIJ_SESSION_NAME" ]; then
    case {title} in
        EXITED)
            exec zellij attach {session}
            ;;
        *)
            exec zellij action switch-session {session}
            ;;
    esac
else
    exec zellij attach {session}
fi
)'''
"@return" = "Accept"

"@print" = [
    "#print",
    '''Become(printf '%s\n' {+session})''',
]

"@copy" = '''CopyAsync(printf '%s\n' {+session})'''

"@new" = '''Become(zellij options --on-force-close detach)'''

"@rm" = [
    "#kill",
    '''ExecuteOrConfirm(
sessions=({+session})
if [ ${#sessions[@]} -eq 1 ]; then
    printf "Kill session: %s? [Y/n]: " "${sessions[@]}"
else
    printf "Kill %s sessions?\n" "${#sessions[@]}"
    printf '    %s\n' "${sessions[@]}"
    printf '[Y/n]: '
fi
read -r
case "$REPLY" in
    [Yy]*|'') ;;
    *) exit 0 ;;
esac
f=()
for s in "${sessions[@]}"; do
    zellij kill-session "$s" 2>/dev/null || f+=("$s")
done
if [ ${#f[@]} -ne 0 ]; then
    echo "Failed: ${f[*]}"
    exit 1
fi
exit 0
)''',
    "Reload",
]

# ring navigation (skip [current]/[other] when they would list no panes)
"@next" = '''BecomeSilent(
if "$(dirname -- "$MM_OVERRIDE")"/zellij.sh has-current-panes; then
    exec mm -o terminal/zellij_current
else
    exec mm -o terminal/zellij_layout
fi
)'''
"@prev" = '''BecomeSilent(
if "$(dirname -- "$MM_OVERRIDE")"/zellij.sh has-other-panes; then
    exec mm -o terminal/zellij_other
else
    exec mm -o terminal/zellij_layout
fi
)'''
