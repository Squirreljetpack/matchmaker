# Switch between zellij sessions
# Preview (hidden by default) shows the session's saved layout KDL

[matcher]
trim = true

[start]
command = "@./zellij.sh sessions"

[exit]
abort_empty = false

[envs]
CATcmd = { value = 'command -v bat --wrap=never --color=always -pp >/dev/null 2>&1 && echo bat || echo cat', exec = true, force = true }

[columns]
split = "tsv"
max = 5
default = "session"
names = [
    { name = "age", options = "Optional | OrUseDefault" },
    { name = "session", options = "Optional" },
    { name = "pane", hidden = true },
    { name = "tab", hidden = true },
    { name = "title", options = "Optional | OrUseDefault" },
]

# --- Preview ---------------------------------------------------------------
[preview]
wrap = false
show = false

# the selected session's cached layout KDL
[[preview.layout]]
command = '''
sess={session}
cache="${XDG_CACHE_HOME:-$HOME/.cache}/zellij"
kdl=""
for dir in "$cache"/*/; do
    [ -f "$dir/session_info/$sess/session-layout.kdl" ] &&
        { kdl="$dir/session_info/$sess/session-layout.kdl"; break; }
done
if [ -n "$kdl" ]; then
    printf '\033[1m%s\033[0m  [%s]  created %s ago\n' "$sess" {title} {age}
    printf '%s\n' '----------------------------------------'
    eval $CATcmd "'$kdl'"
else
    echo "(no saved layout for $sess -- 'zellij action save-session' writes one)"
fi
'''

# stubs disabling the base config preview layouts
[[preview.layout]]
max = 0

[[preview.layout]]
max = 0

# --- UI --------------------------------------------------------------------
[header]
content = ["AGE", "SESSION", "PANE", "TAB", "STATE"]
style.modifier = ""

[query]
prompt = "session> "
prompt_style.fg = "Cyan"

[tui]
percentage = 100

# --- Binds -----------------------------------------------------------------
[binds]
"@accept" = '''Become(
if [ -n "$ZELLIJ" ] || [ -n "$ZELLIJ_SESSION_NAME" ]; then
    case {title} in
        EXITED)
            exec zellij attach {session}
            ;;
        *)
            exec zellij action switch-session {session}
            ;;
    esac
else
    exec zellij attach {session}
fi
)'''

"@print" = [
    "#print",
    '''Become(printf '%s\n' {session})''',
]

"@copy" = '''CopyAsync(printf '%s\n' {session})'''

"@rm" = [
    "#kill",
    '''ExecuteOrConfirm(
printf "Kill session %s? [Y/n] " {session}
read -r ans
case "$ans" in
    [Yy]*|'') zellij kill-session {session};;
    *) exit 0 ;;
esac
)''',
    "Reload",
]

# ring navigation (skip [current]/[other] when they would list no panes)
"@next" = '''BecomeSilent(
if "$(dirname -- "$MM_OVERRIDE")"/zellij.sh has-current-panes; then
    exec mm -o terminal/zellij_current
else
    exec mm -o terminal/zellij_layout
fi
)'''
"@prev" = '''BecomeSilent(
if "$(dirname -- "$MM_OVERRIDE")"/zellij.sh has-other-panes; then
    exec mm -o terminal/zellij_other
else
    exec mm -o terminal/zellij_layout
fi
)'''
