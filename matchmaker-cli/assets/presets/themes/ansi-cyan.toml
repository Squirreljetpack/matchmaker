# ANSI Cyan Theme

[ui.outer_frame]
border_type = "Rounded"
fg = "DarkGray"
sides = "ALL"
style.bg = "Black"

[ui.frame]
sides = ""
padding = [1, 0]
style.bg = "Black"

[query]
prompt = "› "
prompt_style.fg = "LightCyan"
prompt_style.modifier = "BOLD"
style.fg = "White"
style.bg = "Black"

[query.frame]
sides = ""
padding = [1, 0]
style.bg = "Black"

[results.frame]
sides = ""
style.bg = "Black"

[results]
style.fg = "Gray"
current_style.fg = "Black"
current_style.bg = "LightCyan"
current_style.modifier = "BOLD"
inactive_style.fg = "DarkGray"
inactive_current_style.fg = "Black"
inactive_current_style.bg = "Cyan"
match_style.modifier = "BOLD | UNDERLINED"

[status]
show = true
row_connection = "Capped"
template = '\m/\t '
style.fg = "LightCyan"
style.bg = "Black"

[preview.frame]
border_type = "Plain"
sides = "LEFT"
fg = "DarkGray"
padding = [1, 0]
style.bg = "Black"
title_style.fg = "LightCyan"
title_style.modifier = "BOLD"
