# ANSI Line Theme

[ui.outer_frame]
padding = 1
style.bg = "Black"

[ui.frame]
sides = ""
style.bg = "Black"

[query]
prompt = ""
style.fg = "White"
style.bg = "Black"

[query.frame]
sides = ""
style.bg = "Black"

[results.frame]
border_type = "Plain"
fg = "Magenta"
sides = "TOP"
style.bg = "Black"

[results]
separator = "None"
style.fg = "LightBlue"
style.bg = "Black"
inactive_style.fg = "LightBlue"
current_prefix = "❯ "
multi_prefix = "▌ "
row_connection = "Capped"

[results.match_style]
bg = "Cyan"
modifier = "BOLD"

[results.current_style]
fg = "Yellow"
bg = "LightRed"
modifier = "BOLD | DIM"

[results.inactive_current_style]
fg = "LightBlue"
bg = "LightRed"

[results.prefix_style]
fg = "Magenta"

[status]
show = false

[preview.frame]
sides = ""
padding = [0, 0, 0, 1]
style.bg = "Black"

[envs]
BAT_THEME = "Dracula"
