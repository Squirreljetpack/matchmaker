# ANSI Monochrome Theme

[ui.frame]
sides = ""
style.bg = "Black"

[query]
prompt = ":: "
prompt_style.fg = "White"
prompt_style.modifier = "BOLD"
style.fg = "White"
style.bg = "Black"

[query.frame]
sides = ""
style.bg = "Black"

[results.frame]
sides = ""
style.bg = "Black"

[results]
separator = "None"
style.fg = "Gray"
current_style.modifier = "REVERSED"
inactive_style.fg = "DarkGray"
inactive_current_style.modifier = "REVERSED"
match_style.modifier = "BOLD | UNDERLINED"
prefix_style.fg = "White"
prefix_style.modifier = "BOLD"

[status]
show = true
row_connection = "Capped"
template = '\m/\t '
style.fg = "White"
style.bg = "Black"

[preview.frame]
border_type = "Plain"
fg = "DarkGray"
sides = "LEFT"
style.bg = "Black"
padding = [1, 0]
title_style.fg = "White"
title_style.modifier = "BOLD"
