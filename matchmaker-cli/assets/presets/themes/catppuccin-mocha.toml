# Catppuccin Mocha Theme

[query]
prompt = "» "
prompt_style.fg = "#CBA6F7"
prompt_style.modifier = "BOLD"
style.fg = "#CDD6F4"
style.bg = "#1E1E2E"

[results]
style.fg = "#BAC2DE"
current_prefix = " "
multi_prefix = "✔ "
row_connection = "Capped"
style.bg = "#1E1E2E"

[ui.frame]
border_type = "Rounded"
fg = "#45475A"
sides = "ALL"
padding = [2, 0]
style.bg = "#1E1E2E"

[results.match_style]
fg = "#F38BA8"
modifier = "BOLD | UNDERLINED"

[results.current_style]
fg = "#89B4FA"
bg = "#313244"
modifier = "BOLD"

[results.inactive_style]
fg = "#6C7086"

[results.inactive_current_style]
fg = "#A6ADC8"
bg = "#313244"

[results.prefix_style]
fg = "#A6E3A1"

[results.prefix_inactive_style]
fg = "#585B70"

[status]
show = true
template = '{#89B4FA,bold:●} \s {#CBA6F7:line \r} {#585B70:/} {#CDD6F4:\m} '
style.fg = "#6C7086"
style.bg = "#1E1E2E"

[preview.frame]
border_type = "Rounded"
fg = "#45475A"
sides = "ALL"
padding = [2, 0]
title_style.fg = "#CBA6F7"
title_style.modifier = "BOLD"
style.bg = "#1E1E2E"

[ui.outer_frame]
style.bg = "#1E1E2E"

[query.frame]
style.bg = "#1E1E2E"

[results.frame]
style.bg = "#1E1E2E"

[footer.frame]
style.bg = "#1E1E2E"

[header.frame]
style.bg = "#1E1E2E"

[envs]
BAT_THEME = "Catppuccin Mocha"
