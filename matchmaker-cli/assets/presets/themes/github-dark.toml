# GitHub Dark Theme

[query]
prompt = "❯ "
prompt_style.fg = "#7D8590"
prompt_style.modifier = "BOLD"
style.fg = "#E6EDF3"
style.bg = "#1E1E1E"

[results]
style.fg = "#E6EDF3"
inactive_style.fg = "#7D8590"
current_prefix = "❯ "
multi_prefix = "● "
row_connection = "Capped"
style.bg = "#1E1E1E"

[ui.frame]
sides = ""
style.bg = "#1E1E1E"

[results.match_style]
fg = "#58A6FF"
modifier = "BOLD | UNDERLINED"

[results.current_style]
fg = "#FFFFFF"
bg = "#1F242C"
modifier = "BOLD"

[results.inactive_current_style]
fg = "#7D8590"
bg = "#1F242C"

[results.prefix_style]
fg = "#2F81F7"

[status]
show = true
template = '{#58A6FF:\m}/{\t} \s {#7D8590:[\r]} '
style.fg = "#7D8590"
style.bg = "#1E1E1E"

[preview.frame]
border_type = "Plain"
fg = "#30363D"
sides = "ALL"
padding = [1, 0]
title_style.fg = "#58A6FF"
title_style.modifier = "BOLD"
style.bg = "#1E1E1E"

[ui.outer_frame]
padding = [1, 0]
border_type = "Thick"
fg = "#30363D"
sides = "ALL"
style.bg = "#1E1E1E"

[query.frame]
style.bg = "#1E1E1E"

[results.frame]
style.bg = "#1E1E1E"

[footer.frame]
style.bg = "#1E1E1E"

[header.frame]
style.bg = "#1E1E1E"

[envs]
BAT_THEME = "OneHalfDark"
