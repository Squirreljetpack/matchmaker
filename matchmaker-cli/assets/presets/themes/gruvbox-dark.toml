# Gruvbox Dark Theme

[query]
prompt = ":: "
prompt_style.fg = "#FE8019"
prompt_style.modifier = "BOLD"
style.fg = "#EBDBB2"
style.bg = "#282828"

[results]
style.fg = "#EBDBB2"
current_prefix = ">> "
multi_prefix = "■ "
row_connection = "Capped"
separator = "Normal"
style.bg = "#282828"

[results.frame]
border_type = "Double"
fg = "#665C54"
sides = "TOP | BOTTOM"
padding = 0
style.bg = "#282828"

[results.match_style]
fg = "#FABD2F"
modifier = "BOLD"

[results.current_style]
fg = "#FBF1C7"
bg = "#3C3836"
modifier = "BOLD"

[results.inactive_style]
fg = "#7C6F64"

[results.inactive_current_style]
fg = "#A89984"
bg = "#3C3836"

[results.prefix_style]
fg = "#B8BB26"

[results.separator_style]
fg = "#504945"

[status]
show = true
row_connection = "Capped"
template = '\s {#B8BB26:\r}/{#FABD2F:\m} '
style.fg = "#A89984"
style.bg = "#282828"

[preview.frame]
border_type = "Double"
fg = "#665C54"
sides = "TOP | BOTTOM"
padding = [0, 0, 0, 2]
title_style.fg = "#FE8019"
title_style.modifier = "BOLD"
style.bg = "#282828"

[ui.outer_frame]
style.bg = "#282828"

[ui.frame]
sides = ""
style.bg = "#282828"

[query.frame]
style.bg = "#282828"

[footer.frame]
style.bg = "#282828"

[header.frame]
style.bg = "#282828"

[envs]
BAT_THEME = "gruvbox-dark"
