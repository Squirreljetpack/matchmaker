# Preview themes

[start]
command = '''
dir="$(dirname -- "$MM_OVERRIDE")"
for p in "$dir"/*.toml; do
    [ -e "$p" ] || continue
    name="${p##*/}"
    [ "$name" = "main.toml" ] && continue
    name="${name%.toml}"
    printf '%s\0%s\n' "$p" "$name"
done
'''
output = "{=path}"
directory = { value = 'dirname -- "$MM_OVERRIDE"', exec = true, force = true }

[binds]
"@accept" = "Execute(mm -o {path})"
"@reload" = '''BecomeSilent(
export MM_THEME_POS=$MM_POS
exec mm -o themes -o {path}
)'''
"@return" = "Accept"
"Synced" = '''Transform(echo "Pos(${MM_THEME_POS:-0})")'''

[matcher.sort]
threshold = 1

[tui]
percentage = 100

[columns]
split = "\\x00"
max = 2
default = "name"
names = [{ name = "path", hidden = true }, "name"]

# --- Preview ---
[preview]
show = true

[[preview.layout]]
command = '''
if command -v bat >/dev/null 2>&1; then
    bat --color=always -pp -l toml {path}
else
    cat {path}
fi
'''
