# Preview themes

[start]
command = '''
dir="$(dirname -- "$MM_OVERRIDE")"
for p in "$dir"/*.toml; do
    [ -e "$p" ] || continue
    name="${p##*/}"
    # `main.toml` and the platform-prefixed siblings are the theme *pickers*.
    case "$name" in main.toml|win.*|windows.*|macos.*|linux.*|unix.*) continue ;; esac
    name="${name%.toml}"
    printf '%s\0%s\n' "$p" "$name"
done
'''
output = "{=file}"
directory = { value = 'dirname -- "$MM_OVERRIDE"', exec = true, force = true }

[binds]
"@accept" = "Execute(mm -o {file})"
"@reload" = '''BecomeSilent(
export MM_THEME_POS=$MM_POS
exec mm -o themes -o {file}
)'''
"@return" = "Accept"
"Synced" = '''Transform(echo "Pos(${MM_THEME_POS:-0})")'''

[matcher.sort]
threshold = 1

[tui]
percentage = 100

[columns]
split = "\\x00"
max = 2
default = "name"
names = [{ name = "file", hidden = true }, "name"]

# --- Preview ---
[preview]
show = true

[[preview.layout]]
command = '''
if command -v bat >/dev/null 2>&1; then
    bat --color=always -pp -l toml {file}
else
    cat {file}
fi
'''
