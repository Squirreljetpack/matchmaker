# Rosé Pine Theme

[query]
prompt = "✦ "
prompt_style.fg = "#EBBCBA"
prompt_style.modifier = "BOLD"
style.fg = "#E0DEF4"
style.bg = "#191724"

[results]
style.fg = "#E0DEF4"
inactive_style.fg = "#6E6A86"
current_prefix = "❯ "
multi_prefix = "● "
row_connection = "Capped"
style.bg = "#191724"

[ui.frame]
border_type = "Rounded"
fg = "#403D52"
sides = "ALL"
padding = [1, 0]
style.bg = "#191724"

[results.match_style]
fg = "#F6C177"
modifier = "BOLD"

[results.current_style]
fg = "#9CCFD8"
bg = "#26233A"
modifier = "BOLD"

[results.inactive_current_style]
fg = "#E0DEF4"
bg = "#26233A"

[results.prefix_style]
fg = "#EB6F92"

[status]
show = true
template = '{#F6C177:\m} {#6E6A86:/} {#E0DEF4:\t} \s {#EBBCBA:[\r]} '
style.fg = "#6E6A86"
style.bg = "#191724"

[preview.frame]
border_type = "Plain"
fg = "#403D52"
sides = "ALL"
padding = [1, 0]
title_style.fg = "#EBBCBA"
title_style.modifier = "BOLD"
style.bg = "#191724"

[ui.outer_frame]
style.bg = "#191724"

[query.frame]
style.bg = "#191724"

[results.frame]
style.bg = "#191724"

[footer.frame]
style.bg = "#191724"

[header.frame]
style.bg = "#191724"

[envs]
BAT_THEME = "Catppuccin Mocha"
