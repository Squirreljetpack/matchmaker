# Solarized Light Theme

[query]
style.bg = "#FDF6E3"
prompt = "λ "
prompt_style.fg = "#268BD2"
prompt_style.modifier = "BOLD"
style.fg = "#657B83"

[results]
style.bg = "#FDF6E3"
style.fg = "#657B83"
inactive_style.fg = "#93A1A1"
current_prefix = "▶ "
multi_prefix = "✦ "
row_connection = "Capped"

[ui.outer_frame]
padding = 1
style.bg = "#FDF6E3"

[ui.frame]
sides = ""
style.bg = "#FDF6E3"

[results.match_style]
fg = "#B58900"
modifier = "BOLD"

[results.current_style]
fg = "#073642"
bg = "#EEE8D5"
modifier = "BOLD"

[results.inactive_current_style]
fg = "#657B83"
bg = "#EEE8D5"

[results.prefix_style]
fg = "#2AA198"

[status]
style.bg = "#FDF6E3"
show = true
row_connection = "Capped"
template = '\s {#268BD2,bold:λ} {#B58900:\r}/{#657B83:\m} \s '
style.fg = "#93A1A1"

[preview.frame]
border_type = "LightQuadrupleDashed"
fg = "#93A1A1"
padding = [1, 0]
title_style.fg = "#268BD2"
title_style.modifier = "BOLD"
style.bg = "#FDF6E3"

[query.frame]
style.bg = "#FDF6E3"

[results.frame]
style.bg = "#FDF6E3"

[footer.frame]
style.bg = "#FDF6E3"

[header.frame]
style.bg = "#FDF6E3"

[envs]
BAT_THEME = "OneHalfLight"
