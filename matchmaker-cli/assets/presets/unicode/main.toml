# Unicode & Emoji Picker

[start]
command = '''zstd -dc "$(dirname -- "$MM_OVERRIDE")"/unicode.zst'''
additional_commands = [
    "",
    '''zstd -dc "$(dirname -- "$MM_OVERRIDE")"/emoji.zst''',
]
output = "{=char}"

[columns]
split = "\\t"
names = ["char", "name", "cat", "meta"]
default = "name"

[matcher]
backend = "frizbee"
max_typos = 1

# --- UI ---

[header]
content = ['char', 'name', 'cat', 'meta']

# --- Preview ---

[preview]
show = true

[[preview.layout]]
command = '''
char={char}
name={name}
cat={cat}
meta={meta}
codes=$(printf '%s' "$char" | LC_ALL=C od -An -v -tu1 | tr '\n' ' ' | awk '{
    n = 0
    for (i = 1; i <= NF; i++) {
        b = $i
        if (b < 128) { cp = b }
        else if (b < 224) { cp = (b - 192) * 64 + ($(i + 1) - 128); i += 1 }
        else if (b < 240) { cp = ((b - 224) * 4096) + (($(i + 1) - 128) * 64) + ($(i + 2) - 128); i += 2 }
        else { cp = ((b - 240) * 262144) + (($(i + 1) - 128) * 4096) + (($(i + 2) - 128) * 64) + ($(i + 3) - 128); i += 3 }
        printf "%sU+%04X", (n++ ? " " : ""), cp
    }
}')

printf "%${COLUMNS}s\n" | tr ' ' '-'
echo "  $char  $name"
printf "%${COLUMNS}s\n" | tr ' ' '-'

if ((MM_INDEX == 0)); then
    echo "Code:     $codes"
    echo "Category: $cat"
    if [ -n "$meta" ]; then
        primary="${meta%% | *}"
        if [[ "$primary" == \\* ]]; then
            echo "LaTeX:    $primary"
        elif [[ "$primary" == \&* ]]; then
            echo "HTML:     $primary"
        elif [[ "$primary" == nf-* ]]; then
            echo "NerdFont: $primary"
        else
            echo "Keywords: $primary"
        fi
        if [[ "$meta" == *" | "* ]]; then
            echo "Keywords: ${meta#* | }"
        fi
    fi
else
    subgroup="${meta%% | *}"
    echo "Codes:    $codes"
    echo "Group:    $cat"
    echo "Subgroup: $subgroup"
    if [[ "$meta" == *" | "* ]]; then
        echo "Keywords: ${meta#* | }"
    fi
fi
'''

# --- Binds ---

[binds]
"@reload" = ["#next tab", "ReloadNext"]
"@reload_2" = ["#prev tab", "ReloadPrev"]

"@show" = '''RunPreview(
    if ((MM_INDEX == 0)); then
        echo "Unicode Categories:"
        printf "%${COLUMNS}s\n" | tr ' ' '-'
        echo "Uppercase_Letter      Lowercase_Letter      Titlecase_Letter"
        echo "Modifier_Letter       Other_Letter"
        echo "Decimal_Number        Letter_Number         Other_Number"
        echo "Connector_Punctuation Dash_Punctuation      Open_Punctuation"
        echo "Close_Punctuation     Initial_Punctuation   Final_Punctuation"
        echo "Other_Punctuation"
        echo "Math_Symbol           Currency_Symbol       Modifier_Symbol"
        echo "Other_Symbol          Nerd_Font (optional)"
    else
        meta={meta}
        subgroup="${meta%% | *}"
        echo "Emoji Metadata"
        printf "%${COLUMNS}s\n" | tr ' ' '-'
        echo "Group:    "{cat}
        echo "Subgroup: $subgroup"
        if [[ "$meta" == *" | "* ]]; then
            echo "Keywords: ${meta#* | }"
        fi
    fi
)'''

"@copy" = '''CopyAsync(printf '%s' {char})'''

"@copy_meta" = '''CopyAsync(printf '%s' {meta})'''

"@copy_all" = '''CopyAsync(
    printf '%s' {char} | LC_ALL=C od -An -v -tu1 | tr '\n' ' ' | awk '{
        for (i = 1; i <= NF; i++) {
            b = $i
            if (b < 128) { cp = b }
            else if (b < 224) { cp = (b - 192) * 64 + ($(i + 1) - 128); i += 1 }
            else if (b < 240) { cp = ((b - 224) * 4096) + (($(i + 1) - 128) * 64) + ($(i + 2) - 128); i += 2 }
            else { cp = ((b - 240) * 262144) + (($(i + 1) - 128) * 4096) + (($(i + 2) - 128) * 64) + ($(i + 3) - 128); i += 3 }
            printf "\\u{%04X}", cp
        }
    }'
)'''

"0,1^^enter" = [
    '''Copy(printf '%s' {char})''',
    "Quit(0)",
]

# --- Scripts ---

"Start" = '''Transform(
    HEADERS=(
      'unicode> '
      'emoji> '
    )
    setopt KSH_ARRAYS 2>/dev/null
    echo "SetPrompt(${HEADERS[$MM_INDEX]})"
)'''

"Reloaded" = '''Transform(
    HEADERS=(
      'unicode> '
      'emoji> '
    )
    setopt KSH_ARRAYS 2>/dev/null
    echo "SetPrompt(${HEADERS[$MM_INDEX]})"
)'''
