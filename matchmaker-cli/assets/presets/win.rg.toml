# Full text search

[matcher]
ansi = true
require_column = 1

[start]
# The payloads below are PowerShell; pin the dialect so the shell heuristic
# (PSModulePath → pwsh/powershell, else cmd.exe) cannot pick the wrong one.
shell = ["powershell", "-NoProfile", "-Command"]
command = '''rg --column --line-number --no-heading --color=always --smart-case "$env:FZF_QUERY"'''
output = "{=1}:{=2}"

[columns]
max = 3
names = ["file", "pos", ""]
split = '^(.*?):(\d+:\d+):(.*)$'
default = "file"

[exit]
abort_empty = false

# --- Preview ---
[preview]
show = true
scroll.percentage = 70
scroll.index = "pos"

[previewer]
shell = ["powershell", "-NoProfile", "-Command"]

[[preview.layout]]
command = '''
$line = {2}
$file = {1}
$highlightLine = ($line -split ':')[0]

if (Get-Command bat -ErrorAction SilentlyContinue) {
    bat --wrap=never --color=always -pp $highlightLine $file
} else {
    Get-Content -LiteralPath $file -Raw -Encoding UTF8
}
'''
frame = { border_type = "LightDoubleDashed", fg = "DarkGray", title = "File Contents" }
side = "top"
percentage = 50
min = 5
padding = 0

# --- UI ---

[query]
prompt_style.fg = "Red"

[tui]
percentage = 100

[results]
inactive_current_style.fg = "DarkGray"
inactive_current_style.bg = "Black"
scroll_wrap = true

[binds]
"enter" = "@accept"
"ctrl-r" = "@reload"
"ctrl-." = "NextColumn"
"?" = "SwitchPreview"

"0,1^^@accept" = '''Become(
$editor = $(if ($env:EDITOR) { $env:EDITOR } else { 'notepad' }) -split '\s+'
& $editor[0] @($editor | Select-Object -Skip 1) {1}
)'''

# --- Scripts ---
"Start" = "@enter_rg"
# Reload on query change, disable reparsing, update bind
"@enter_rg" = [
    "Filtering(false)",
    '''Bind(QueryChange = Reload)''',
    # Prompt indicator
    '''Transform(#!lua
local query = env.MM_QUERY or ""
local trimmed = query:gsub("^%%1%s*", "")
local lines = {}
if query ~= "" then
    lines[#lines + 1] = "SetStyledPrompt({blue,italic:(" .. trimmed .. ")} )"
else
    lines[#lines + 1] = "SetPrompt(rg> )"
end
lines[#lines + 1] = "SetQuery(" .. (env.MM_STORE or "") .. ")"
lines[#lines + 1] = "Store(" .. query .. ")"
return table.concat(lines, "\n")
)''',
    "Bind(@reload = @enter_mm)",
]
"@enter_mm" = [
    "Filtering(true)",
    "Unbind(QueryChange)",
    '''Transform(#!lua
local query = env.MM_QUERY or ""
local lines = {}
if query ~= "" then
    lines[#lines + 1] = "SetPrompt((" .. query .. ") )"
else
    lines[#lines + 1] = "SetStyledPrompt({blue,italic:mm> })"
end
lines[#lines + 1] = "SetQuery(" .. (env.MM_STORE or "") .. ")"
lines[#lines + 1] = "Store(" .. query .. ")"
lines[#lines + 1] = "SwitchColumn(1)"
return table.concat(lines, "\n")
)
''',
    "Bind(@reload = @enter_rg)",
]
