# "alt-right" = "HScroll(1)"
# "ctrl-[" = "ToggleWrap", # requires keyboard enhancement
# "ctrl-]" = "TogglePreviewWrap",  # requires keyboard enhancement
# "alt-{" = "ToggleWrap",
# "alt-}" = "TogglePreviewWrap",
"ctrl-[" = ["ToggleWrap", "ToggleHeaderWrap"] # requires keyboard enhancement

"alt-s" = "Sort"
"alt-n" = "SortNumeric"
"alt-r" = "SortReverse"

"alt-=" = "ExpandColumn"
"alt-hyphen" = "ShrinkColumn"

# Columns
"ctrl-." = "NextColumn" # requires keyboard enhancement
"ctrl-shift-." = "PrevColumn" # requires keyboard enhancement
"alt-." = "NextColumn"
"alt-shift-." = "PrevColumn"
"alt-\\" = "HideColumn"
"alt-shift-\\" = "UnhideColumn"

# Preview
"ctrl-j" = "PreviewJump"

### (DEFAULTS) ###
# "?" = "SwitchPreview"
# "alt-/" = "NextPreview"
# "alt-shift-/" = "PrevPreview"
# "ctrl-/" = "NextPreview" # requires keyboard enhancement
# "ctrl-shift-/" = "PrevPreview" # requires keyboard enhancement
# "alt-h" = "Help"

"alt-shift-=" = "ExpandPreview"
"alt-+" = "ExpandPreview" # A terminal might only transmit alt-shift-=
"alt-shift-hyphen" = "ShrinkPreview"

# Reserved
"F1" = "@help"
"F2" = "@rename"
"F3" = "@search"
"F4" = "@rm"
"F5" = "@refresh"
"F6" = "@cycle"
"F7" = "@build"
"F8" = "@step"
"F9" = "@toggle"
"F10" = "@menu"
"F11" = "ShowPreview"
"F12" = "@save"

# Programmable
"ctrl-l" = "ShowPreview" # page the preview fullscreen
"ctrl-o" = "@open"
"alt-o" = "@open_2"
"ctrl-r" = "@reload"
"ctrl-shift-r" = "@reload_2"
"ctrl-shift-n" = "@next"
"ctrl-shift-p" = "@prev"
"alt-tab" = "@next"
"alt-shift-backtab" = "@prev"
"alt-shift-tab" = "@prev"
"ctrl-d" = "@rm"
"Delete" = "@rm"
"ctrl-s" = "@show"

"@accept" = "Accept"
"@open" = '''ExecuteOrConfirm(#!lua
local c = state.current or {}
local p = c.file
if not p or p == "" then
    p = c[1]
    local f = io.open(p or "", "r")
    if not f then os.exit(1) end
    f:close()
end
os.execute(string.format("%q %q", os.getenv("EDITOR") or "notepad", p))'''
"@open_2" = "Become(powershell -Command \"& $env:EDITOR {1}\")"
"@reload" = "Reload"
# "@next" = ["ReloadNext", "Cancel"] # see mm --doc binds
# "@prev" = ["ReloadPrev", "Cancel"]
"@help" = "Help"
"@refresh" = "Redraw" # invalid unicode or unsupported emoji can break rendering

# Printing
"alt-p" = "@print"
"alt-shift-p" = "@print_2"
"ctrl-y" = "@copy"
"ctrl-shift-y" = "@copy_all" # requires keyboard enhancement
"alt-shift-y" = "@copy_all"
"alt-y" = "@copy_active"

"@print" = "Print({-})"
"@print_2" = "Print({-!})"
"@copy" = '''CopyAsync(#!lua local t = {}
for _, it in ipairs(state.selected) do t[#t + 1] = it[1] end
return table.concat(t, "\n"))'''
"@copy_all" = '''CopyAsync(#!lua return state.raw or "")'''
"@copy_active" = '''CopyAsync(#!lua local a = state.active; local t = {}
for _, it in ipairs(state.selected) do if it[a] then t[#t + 1] = it[a] end end
return table.concat(t, "\n"))'''
