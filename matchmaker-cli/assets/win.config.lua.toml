[tui]
percentage = 60
min = 10
max = 120
scroll = "Expansive" # Expansive | Aggressive | Lazy | Compact

# --- UI ---
[ui]
# tick_rate = 60
# mouse_events = true

[query]
prompt_style.fg = "Gray"
prompt_style.modifier = "ITALIC"
# word movement stops at these characters in addition to whitespace
# word_boundaries = ['.', '/']

[results]
# wrap = true
# reverse = false # set this to prevent flipping when using -F
max_height = 16

[status]
template = '\m/\t'
show = true

[header]

[footer]
# --- Preview ---
[preview]
wrap = true
scroll_wrap = true

[[preview.layout]]
command = '''
$p = {1}
if (Test-Path -LiteralPath $p -PathType Container) {
    if (Get-Command eza -ErrorAction SilentlyContinue) {
        eza --color=always -T -L 2 $p
    } else {
        Get-ChildItem -LiteralPath $p | Select-Object -First 20 | ForEach-Object { "  $($_.Name)" }
    }
} else {
    if (Get-Command bat -ErrorAction SilentlyContinue) {
        bat --binary no-printing --color=always --style=-numbers $p
    } else {
        Get-Content -LiteralPath $p -Raw
    }
}
'''

side = "right"
percentage = 40
min = 30
max = 120
border.type = "Plain"
border.padding = [2, 0]

[[preview.layout]]
side = "top"
percentage = 55
min = 5
max = 50
border.type = "Plain"

[[preview.layout]]
side = "right"
percentage = 75
min = 5
max = 240
border.type = "Plain"
border.padding = [2, 0]

[previewer]
always_trigger = true
# help.combine_keys = false

# --- Misc ---
[matcher]
# ansi = false # don't set to true here
sort.threshold = 1 # maintain initial ordering

[columns]

[start.command]
command = '''
if (Get-Command fd -ErrorAction SilentlyContinue) {
    fd --strip-cwd-prefix --print0
} else {
    Get-ChildItem -Recurse -File | ForEach-Object FullName
}
'''
separator = "\\0"

[start]
skip_invalid_lines = true # set false to error on encountering invalid utf-8

[exit]
abort_empty = true

[envs]
# CLIPcmd = # Leave blank to auto-determine
# PASTEcmd = # Leave blank to auto-determine
# PAGER = # Leave blank to auto-determine
# EDITOR = # Leave blank to auto-determine

# --- Binds ---
[binds]
# Essentia
# "ctrl-c" = "Quit(1)"
# "esc" = "Quit(1)"
"enter" = "@accept"
"alt-enter" = "@Accept" # presets can bind this to "Accept" if "@accept" is overridden
# "ctrl-enter" = "@Accept" # requires enhancement
"ctrl-a" = "CycleSelections"
"tab" = ["Toggle", "Down"]
"shift-backtab" = ["Toggle", "Up"]

# Edit
### (DEFAULTS) ###
# "right" = "ForwardChar"
# "left" = "BackwardChar"
# "ctrl-right" = "ForwardWord"
# "ctrl-left" = "BackwardWord"
# "backspace" = "DeleteChar"
# "ctrl-h" = "DeleteWord"
# "ctrl-u" = "Cancel"
# "alt-a" = "QueryPos(0)"

# Navigation
"alt-1" = "Pos(0)"
"alt-0" = "Pos(-1)"

### (DEFAULTS) ###
# "up" = "Up"
# "down" = "Down"
# "pagedown" = "HalfPageDown"
# "pageup" = "HalfPageUp"
# "shift-up" = "PreviewHalfPageUp"
# "shift-down" = "PreviewHalfPageDown"
# "ctrl-shift-up" = "VScroll(1)"
# "ctrl-shift-down" = "VScroll(-1)"
# "ctrl-shift-left" = "HScroll(-1)"
# "ctrl-shift-right" = "HScroll(1)"
# "alt-up" = "VScroll(1)"
# "alt-down" = "VScroll(-1)"
