[tui]
percentage = 60
min = 10
max = 120

[ui]

[query]

[results]
delay_clear = true
wrap = true

[status]
template = '\m/\t'
show = true

[preview]
show = true
wrap = true

[preview.frame]
border_type = "Plain"
padding = [2, 0]

[binds]
# UI
# "ctrl-c" = "Quit(1)"
# "esc" = "Quit(1)"
"enter" = "Accept"
"ctrl-a" = "CycleSelections"
"tab" = ["Toggle", "Down"]
"shift-backtab" = ["Toggle", "Up"]

# Edit
"right" = "ForwardChar"
"left" = "BackwardChar"
"ctrl-right" = "ForwardWord"
"ctrl-left" = "BackwardWord"
"backspace" = "DeleteChar"
"ctrl-backspace" = "DeleteWord"
"ctrl-u" = "Cancel"
"alt-a" = "QueryPos(0)"

# Navigation
"up" = "Up"
"down" = "Down"
"pageup" = "HalfPageDown"
"pagedown" = "HalfPageUp"
"shift-up" = "PreviewHalfPageUp"
"shift-down" = "PreviewHalfPageDown"
"alt-shift-up" = "VScroll(1)"
"alt-shift-down" = "VScroll(-1)"
"alt-shift-left" = "HScroll(-1)"
"alt-shift-right" = "HScroll(1)"
"alt-up" = "VScroll(1)"
"alt-down" = "VScroll(-1)"
"alt-left" = "HScroll(-1)"
"alt-right" = "HScroll(1)"

# Columns
"ctrl-." = "NextColumn"

# Preview
"shift+scrollup" = "PreviewUp"
"shift+scrolldown" = "PreviewDown"
"?" = "SwitchPreview"
"shift-?" = "SwitchPreview"
"ctrl-shift-/" = "NextPreview" # cycle preview layouts
"alt-h" = "Help"
"alt-1" = "Pos(0)"

# Programmable
"ctrl-l" = "ShowPreview" # page the preview fullscreen
"ctrl-shift-l" = "RunPreview"
"ctrl-o" = "Execute(%EDITOR% {})"
"alt-o" = "Become(%EDITOR% {})"
"ctrl-r" = "Reload"
