[package]
name = "matchmaker-lib"
version = "0.1.3"
categories = ["command-line-utilities", "rust-patterns"]
edition = "2024"
exclude = ["assets/"]
keywords = ["fuzzy", "finder", "tui", "nucleo", "fzf"]
license = "MIT"
repository = "https://github.com/Squirreljetpack/matchmaker"
description = "A fuzzy finder for the terminal, powered by nucleo"

[dependencies]
cli_boilerplate_automation = { version = "0.6.0", features = ["serde", "bring"] }
matchmaker-partial = { workspace = true, optional = true }
matchmaker-partial-macros = { workspace = true, default-features = false }

ansi-to-tui = "8.0.1"
ratatui = { version = "0.30.2", features = ["serde"] }

unicode-segmentation = "1.13.3"
unicode-width = "^0.2.2"

anyhow = "1.0.104"
arc-swap = "1.9.2"
arrayvec = "0.7.8"
atoi = "3.1.0"
atty = "0.2.14"
bitflags = "2.13.1"
bitflags-derive = "0.0.5"
boxcar = "0.2.14"
crokey = "1.5.0"
crossterm = { version = "0.29.0", features = ["event-stream", "serde", "use-dev-tty"] }
easy-ext = "1.0.3"
env_logger = "0.11.11"
futures = "0.3.33"
indexmap = { version = "2.14.0" }
log = "0.4.33"
mio = "1.2.2"
# nix = { version = "0.30.1", features = ["term"] }
nucleo = { workspace = true }
paste = "1.0.15"
phf = { version = "0.14.0", features = ["macros", "phf_macros"] }
# rayon = "1.11.0"
regex = "1.13.1"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["poll", "signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = "0.61.2"

[features]
default = []
bracketed-paste = ["crossterm/bracketed-paste"]
parallelism = []
experimental = []
partial = ["matchmaker-partial", "matchmaker-partial-macros/partial"]

[lib]
name = "matchmaker"
path = "src/lib.rs"

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "noninteractive"
path = "examples/noninteractive.rs"

[[example]]
name = "pick_1"
path = "examples/pick_1.rs"

[[example]]
name = "ripgrep"
path = "examples/ripgrep.rs"

[[example]]
name = "overlay"
path = "examples/overlay.rs"

[lints]
workspace = true
