[package]
name = "matchmaker-partial-macros"
version = "0.0.30"
edition = "2024"
license = "MIT"
repository = "https://github.com/Squirreljetpack/matchmaker"
description = "Derive macros for the matchmaker-partial crate"

[features]
default = ["partial"]
partial = []

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.3", features = ["full"] }

[lints]
workspace = true
